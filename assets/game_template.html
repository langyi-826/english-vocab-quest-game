<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__TITLE__</title>
<script>
/* 全局错误提示（ES5 语法，任何浏览器都能执行） */
window.addEventListener('error', function(e){
  var m = document.getElementById('fatal');
  if(m){ m.style.display='block'; m.textContent = '页面出错：' + (e.message || e.error || '未知错误') + ' ｜ 如持续出错，请改用 Edge 或 Chrome 浏览器打开本文件'; }
});
/* 兼容性检测：老浏览器（IE 内核 / 双核浏览器兼容模式）给出友好提示，而不是白屏 */
(function(){
  var ok = false;
  try{
    ok = (typeof Symbol !== 'undefined') && (typeof Promise !== 'undefined') && !!new Function('a','return a=>a;')()('x');
  }catch(e){ ok = false; }
  if(ok) return;
  var d = document.createElement('div');
  d.setAttribute('style','position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:#FAF6EF;color:#1F2B27;font:16px/1.9 "Microsoft YaHei",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;');
  d.innerHTML = '<div style="max-width:520px;background:#fff;border-radius:14px;box-shadow:0 10px 40px rgba(58,48,32,.15);padding:32px 28px;">'
    + '<div style="font-size:22px;font-weight:bold;margin-bottom:12px;">当前浏览器版本过旧，暂时无法打开</div>'
    + '<div style="color:#6E7F79;">请任选其一：</div>'
    + '<div style="margin-top:8px;">1. 用电脑自带的 <b>Edge</b> 或 <b>Chrome</b> 浏览器，双击打开本文件；</div>'
    + '<div>2. 若用的是 360 / QQ / 搜狗等双核浏览器，点击<b>地址栏右侧的闪电图标</b>，切换到「<b>极速模式</b>」后刷新页面。</div>'
    + '</div>';
  (document.body || document.documentElement).appendChild(d);
  window.__COMPAT_FAIL__ = true;
})();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#FAF6EF; --card:#FFFFFF; --ink:#1F2B27; --sub:#6E7F79; --line:#E8E0D2;
  --green:#1F6F5C; --green-d:#175546; --green-l:#E3EFEA;
  --orange:#DE7A5C; --orange-l:#FBEAE4;
  --gold:#F0B03F; --gold-l:#FDF2DC;
  --blue:#5A86D4; --blue-l:#E8EFFA;
  --red:#CE5A56; --red-l:#FBEAE9;
  --shadow:0 2px 10px rgba(58,48,32,.07), 0 10px 30px rgba(58,48,32,.05);
}
html,body{height:100%}
body{
  background:#EDE6D8; color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
  display:flex; justify-content:center; overflow-x:hidden;
}
.app{
  width:100%; max-width:520px; min-height:100dvh; background:var(--bg);
  position:relative; display:flex; flex-direction:column; overflow:hidden;
  box-shadow:0 0 60px rgba(60,50,35,.08);
}
.side{display:none}
.main-wrap{flex:1; display:flex; flex-direction:column; min-height:0}
/* ---------- HUD ---------- */
.hud{
  flex:none; padding:12px 16px 10px; background:rgba(250,246,239,.94);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:30;
}
.rank{flex:1; min-width:0}
.rank-name{font-size:14px; font-weight:700; letter-spacing:.3px; display:flex; align-items:center; gap:6px}
.rank-bar{height:5px; background:var(--line); border-radius:3px; margin-top:5px; overflow:hidden}
.rank-fill{height:100%; background:linear-gradient(90deg,var(--green),#3E9C82); border-radius:3px; transition:width .5s}
.rank-sub{font-size:10.5px; color:var(--sub); margin-top:4px}
.hud-chip{
  display:flex; align-items:center; gap:4px; font-size:13.5px; font-weight:700;
  background:var(--card); border:1px solid var(--line); border-radius:20px;
  padding:5px 10px 5px 7px; white-space:nowrap;
}
.hud-chip svg{width:15px;height:15px;flex:none}
.chip-fire{color:var(--orange)}
.chip-shard{color:var(--blue)}
.pulse{animation:pulse .4s}
@keyframes pulse{50%{transform:scale(1.18)}}

/* ---------- 主区 ---------- */
main{flex:1; overflow-y:auto; overflow-x:hidden; padding:16px 16px 28px; -webkit-overflow-scrolling:touch}
main.no-scroll{overflow:hidden}

/* ---------- 通用 ---------- */
.btn{
  border:none; border-radius:14px; padding:14px 18px; font-size:15px; font-weight:700;
  font-family:inherit; cursor:pointer; transition:transform .12s, filter .15s;
  display:flex; align-items:center; justify-content:center; gap:7px;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--green); color:#fff; box-shadow:0 4px 14px rgba(31,111,92,.24)}
.btn-primary:disabled{background:#C9CFC9; box-shadow:none; color:#fff}
.btn-ghost{background:var(--card); color:var(--ink); border:1.5px solid var(--line)}
.btn-danger{background:#C64B3E; color:#fff; box-shadow:0 4px 14px rgba(198,75,62,.24)}
.btn-danger:active{background:#A93A2E}
.btn-orange{background:var(--orange); color:#fff; box-shadow:0 4px 14px rgba(222,122,92,.26)}
.btn-sm{padding:9px 14px; font-size:13.5px; border-radius:11px}

.card{background:var(--card); border-radius:18px; box-shadow:var(--shadow)}
.sec-title{font-size:13px; font-weight:700; color:var(--sub); letter-spacing:.6px; margin:20px 2px 10px; display:flex; justify-content:space-between; align-items:baseline}
.sec-title .link{font-size:12px; color:var(--green); font-weight:700; cursor:pointer; letter-spacing:0}

/* ---------- 地图 ---------- */
.daily{
  background:linear-gradient(135deg,#1F6F5C,#2C8A70); color:#fff; border-radius:20px;
  padding:15px 20px; box-shadow:0 6px 22px rgba(31,111,92,.22); position:relative; overflow:hidden;
  display:flex; align-items:center; justify-content:space-between; gap:26px;
}
.daily-main{flex:1; min-width:0; position:relative; z-index:1}
.daily-cta{position:relative; z-index:1}
.daily::after{content:""; position:absolute; right:-30px; top:-30px; width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,.07)}
.daily-top{display:flex; justify-content:space-between; align-items:center; font-size:13px; opacity:.9}
.daily-num{font-size:25px; font-weight:800; margin-top:6px; letter-spacing:.5px}
.daily-num small{font-size:13px; font-weight:600; opacity:.75; margin-left:4px}
.daily-bar{height:6px; background:rgba(255,255,255,.22); border-radius:3px; margin-top:12px; overflow:hidden}
.daily-fill{height:100%; background:#F5C86B; border-radius:3px; transition:width .6s}
.daily-tip{font-size:11.5px; opacity:.8; margin-top:9px}

.tabs{display:flex; gap:7px; margin:10px 0 14px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none; padding:8px 14px; border-radius:11px; font-size:13px; font-weight:700;
  background:var(--card); color:var(--sub); border:1.5px solid var(--line); cursor:pointer; transition:.15s;
}
.tab.on{background:var(--ink); color:#fff; border-color:var(--ink)}
.tab.review{color:#B4762A; border-color:#EFD9BC; background:#FFF9EE}
.tab.review.on{background:var(--orange); border-color:var(--orange); color:#fff}

/* 学段标签：由档案决定，不可切换 */
.stage-tabs{display:flex; margin:16px 0 10px}
.stage-now{
  flex:1; text-align:center; font-size:13px; font-weight:800; letter-spacing:.6px;
  padding:9px 8px; border-radius:11px; color:#fff;
  background:linear-gradient(135deg,#1F6F5C,#3E9C82); box-shadow:0 6px 16px rgba(31,111,92,.2);
}

/* 年级切换 */
.grade-tabs{display:flex; gap:7px; margin-bottom:4px}
.grade-tab{
  flex:1; font-family:inherit; font-size:14px; font-weight:800; padding:9px 2px;
  border-radius:11px; border:1.5px solid var(--line); background:var(--card); color:var(--sub);
  cursor:pointer; transition:.15s; line-height:1.15; white-space:nowrap;
}
.grade-tab span{font-size:10px; font-weight:700; opacity:.72; margin-left:1px}
.grade-tab.on{background:var(--green-l); border-color:var(--green); color:var(--green-d)}
.grade-tab:active{transform:scale(.97)}

.rev-tag{display:inline-block; font-size:10.5px; font-weight:800; color:#B4762A; background:#FDF0DC; border:1px solid #EFD9BC; border-radius:6px; padding:1px 6px; margin-left:7px; vertical-align:2px}

/* 注册：学段选择卡 */
.pf-stages{display:flex; gap:10px}
.pf-stage{
  flex:1; font-family:inherit; text-align:left; padding:13px 15px; border-radius:14px;
  border:1.5px solid var(--line); background:#fff; cursor:pointer; transition:.16s; line-height:1.3;
}
.pf-stage b{display:block; font-size:14.5px; font-weight:800; color:var(--ink)}
.pf-stage span{display:block; font-size:10.5px; color:var(--sub); margin-top:3px}
.pf-stage.on{border-color:var(--green); background:var(--green-l); box-shadow:0 6px 16px rgba(31,111,92,.13)}
.pf-stage.on b{color:var(--green-d)}
.pf-stage:active{transform:scale(.98)}

.book-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px; padding:0 2px}
.book-head h2{font-size:17px; font-weight:800; letter-spacing:.2px}
.book-head span{font-size:12px; color:var(--sub)}

.grid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px}
.lv-sec{grid-column:1/-1; display:flex; align-items:baseline; gap:8px; margin:6px 2px 0; padding-top:7px; border-top:1px dashed #E4DCCB}
.lv-sec:first-child{border-top:none; padding-top:0; margin-top:0}
.lv-sec span{font-size:12px; font-weight:800; color:#B4762A; letter-spacing:.4px}
.lv-sec i{font-size:10.5px; font-style:normal; color:var(--sub)}
.lv{
  height:56px; border-radius:13px; background:var(--card); border:1.5px solid var(--line);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  cursor:pointer; position:relative; transition:transform .12s, box-shadow .2s; box-shadow:0 1px 4px rgba(58,48,32,.05);
}
.lv:active{transform:scale(.94)}
.lv-num{font-size:15px; font-weight:800; color:var(--ink); line-height:1}
.lv-stars{display:flex; gap:2px; height:9px; align-items:center}
.lv-stars svg{width:7.5px;height:7.5px}
.lv.locked{background:#F0EBE0; border-color:#E5DDCE; cursor:not-allowed; opacity:.7}
.lv.locked .lv-num{color:#BDB3A0}
.lv.done{background:var(--green-l); border-color:#BFDCD2}
.lv.done .lv-num{color:var(--green-d)}
.lv.next{border-color:var(--orange); box-shadow:0 0 0 3px rgba(222,122,92,.13)}
.lv.next::before{
  content:""; position:absolute; top:-4px; right:-4px; width:9px; height:9px;
  background:var(--orange); border-radius:50%; border:2px solid var(--bg);
}

.stage{display:flex;flex-direction:column;justify-content:center;min-height:calc(100dvh - 205px)}
.stage-mid{justify-content:center}
.q-top{flex:none}
.q-bottom{flex:none;margin-top:24px}

.tts-btn{
  position:absolute; top:13px; right:13px; width:38px; height:38px; border-radius:50%;
  background:var(--green-l); border:none; display:flex; align-items:center; justify-content:center;
  color:var(--green); cursor:pointer; transition:transform .12s, background .15s; z-index:2;
}
.tts-btn:active{transform:scale(.9)}
.face-back .tts-btn{background:rgba(255,255,255,.18); color:#fff}
.face-back .tts-btn:active{background:rgba(255,255,255,.3)}
.tts-mini{
  display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px;
  border-radius:10px; background:var(--bg); border:1.5px solid var(--line); color:var(--sub);
  cursor:pointer; vertical-align:middle; margin-left:10px; transition:transform .12s;
}
.tts-mini:active{transform:scale(.92)}
.tts-mini svg{pointer-events:none}

/* ---------- 闪卡 ---------- */
.topbar{display:flex; align-items:center; gap:12px; margin-bottom:16px}
.icon-btn{
  width:36px; height:36px; border-radius:11px; background:var(--card); border:1.5px solid var(--line);
  display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;
}
.icon-btn svg{width:17px;height:17px}
.bar{flex:1; height:7px; background:var(--line); border-radius:4px; overflow:hidden}
.bar-fill{height:100%; background:var(--green); border-radius:4px; transition:width .35s}
.bar-label{font-size:12px; color:var(--sub); font-weight:700; flex:none; min-width:44px; text-align:right}

.flash-wrap{perspective:1200px; margin:6px 0 20px}
.flash{
  position:relative; width:100%; height:min(54vh,370px); cursor:pointer;
  transform-style:preserve-3d; transition:transform .5s cubic-bezier(.4,.2,.2,1);
}
.flash.flipped{transform:rotateY(180deg)}
.face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:24px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:26px; text-align:center; box-shadow:var(--shadow);
}
.face-front{background:var(--card); border:1.5px solid var(--line)}
.face-back{background:linear-gradient(150deg,#1F6F5C,#2A8269); color:#fff; transform:rotateY(180deg)}
.fw{font-size:40px; font-weight:800; letter-spacing:.5px; line-height:1.15; word-break:break-word}
.fw.long{font-size:29px}
.fw.xlong{font-size:22px}
.fpos{font-size:13px; color:var(--sub); margin-top:10px; font-weight:600}
.face-back .fpos{color:rgba(255,255,255,.7)}
.fcn{font-size:23px; font-weight:700; line-height:1.4; max-width:100%}
.fcn.long{font-size:19px}
.fhint{font-size:12px; margin-top:18px; color:var(--sub); opacity:.8}
.face-back .fhint{color:rgba(255,255,255,.65)}
.tag-phrase{
  position:absolute; top:14px; left:16px; font-size:10.5px; font-weight:700;
  color:var(--orange); background:var(--orange-l); padding:3px 8px; border-radius:7px; letter-spacing:.5px;
}
.face-back .tag-phrase{background:rgba(255,255,255,.16); color:#fff}

/* ---------- 正面：精简字典卡 ---------- */
.face-front{padding:0; justify-content:flex-start; align-items:stretch; text-align:left; overflow:hidden}
.fc-head{flex:none; position:relative; padding:28px 30px 20px; border-bottom:1px solid var(--line)}
.fc-word{font-size:44px; font-weight:800; line-height:1.15; letter-spacing:.5px; word-break:break-word; padding-right:52px}
.fc-word.long{font-size:32px} .fc-word.xlong{font-size:24px}
.fc-ipa{font-size:17px; font-weight:700; color:var(--green); margin-top:10px; letter-spacing:.4px}
.fc-ipa .fp{font-size:12px; font-weight:600; color:var(--sub); margin-left:14px; letter-spacing:0}
.fc-body{flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center; gap:20px; padding:20px 30px}
.fc-row{display:flex; align-items:baseline; gap:14px}
.fc-k{flex:none; min-width:46px; font-size:11px; font-weight:800; color:var(--sub); letter-spacing:.5px}
.fc-v{font-size:15px; line-height:1.5; color:var(--ink); word-break:break-word}
.my-mne{width:100%; box-sizing:border-box; font:13px/1.5 inherit; border:1px solid var(--line); border-radius:9px; padding:9px 12px; background:#FCFAF5; color:var(--ink)}
.my-mne:focus{outline:none; border-color:var(--green); background:#fff}
.fc-foot{flex:none; display:flex; align-items:center; justify-content:flex-end; padding:12px 30px 18px; border-top:1px solid var(--line)}
.fc-flip{font-size:13px; font-weight:800; color:var(--green); white-space:nowrap; cursor:pointer}
.face-back .fcn{font-size:26px; font-weight:700; line-height:1.45; max-width:100%}

.flash-actions{display:flex; gap:11px}
.flash-actions .btn{flex:1}

/* ---------- 答题 ---------- */
.q-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px}
.q-tag{font-size:11.5px; font-weight:800; padding:5px 11px; border-radius:8px; letter-spacing:.4px}
.q-tag.spell{background:var(--blue-l); color:var(--blue)}
.q-tag.choice{background:var(--gold-l); color:#B9821F}
.q-combo{font-size:12.5px; font-weight:800; color:var(--orange); opacity:0; transition:.2s}
.q-combo.on{opacity:1}

.q-box{background:var(--card); border-radius:20px; box-shadow:var(--shadow); padding:24px 20px; text-align:center; margin-bottom:18px}
.q-prompt{font-size:13px; color:var(--sub); font-weight:600; margin-bottom:12px; letter-spacing:.5px}
.q-word{font-size:33px; font-weight:800; line-height:1.2; word-break:break-word}
.q-word.long{font-size:25px}
.q-cn{font-size:26px; font-weight:800; line-height:1.35}
.q-cn.long{font-size:21px}
.q-meta{font-size:12.5px; color:var(--sub); margin-top:12px}
.q-meta b{color:var(--ink); font-weight:700}

.opts{display:flex; flex-direction:column; gap:10px}
.opt{
  background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:15px 16px;
  font-size:16px; font-weight:600; cursor:pointer; text-align:left; transition:.15s; font-family:inherit;
  display:flex; align-items:center; gap:11px; color:var(--ink);
}
.opt:active{transform:scale(.985)}
.opt-key{
  width:24px; height:24px; border-radius:7px; background:var(--bg); border:1px solid var(--line);
  font-size:12px; font-weight:800; color:var(--sub); display:flex; align-items:center; justify-content:center; flex:none;
}
.opt.right{background:var(--green-l); border-color:var(--green); color:var(--green-d)}
.opt.right .opt-key{background:var(--green); color:#fff; border-color:var(--green)}
.opt.wrong{background:var(--red-l); border-color:var(--red); color:var(--red)}
.opt.wrong .opt-key{background:var(--red); color:#fff; border-color:var(--red)}
.opt.dim{opacity:.45}


/* ---------- 拼写字母格 + 自带键盘（不使用 input，杜绝输入法联想） ---------- */
.spell-display{
  display:flex; flex-wrap:wrap; gap:7px; justify-content:center; align-items:flex-end;
  min-height:56px; padding:12px 10px; background:var(--card); border:2px solid var(--line);
  border-radius:15px; transition:.15s;
}
.spell-display.right{border-color:var(--green); background:var(--green-l)}
.spell-display.wrong{border-color:var(--red); background:var(--red-l)}
.slot{
  width:26px; height:38px; border-bottom:3px solid #CFC6B4; display:flex; align-items:center;
  justify-content:center; font-size:22px; font-weight:800; color:var(--ink); line-height:1;
  font-family:'Courier New', monospace; text-transform:lowercase;
}
.slot.filled{border-bottom-color:var(--green)}
.slot.gap{width:14px; border-bottom-color:transparent}
.spell-display.right .slot{border-bottom-color:var(--green); color:var(--green-d)}
.spell-display.wrong .slot{border-bottom-color:var(--red); color:var(--red)}
.spell-display .slot.caret{border-bottom-color:var(--orange); animation:caretBlink 1s steps(1) infinite}
@keyframes caretBlink{50%{border-bottom-color:transparent}}

.spell-hintline{font-size:11px; color:var(--sub); text-align:center; margin-top:8px}
.spell-hintline b{color:var(--orange)}
.spell-actions{display:flex; gap:10px; justify-content:center; align-items:center; margin-top:14px}
.spell-actions .btn{flex:none}
@keyframes slotShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.spell-display.shake{animation:slotShake .18s ease 2}
.hint-row{display:flex; justify-content:center; margin-top:12px}
.hint-btn{
  background:none; border:none; font-family:inherit; font-size:12.5px; font-weight:700; color:var(--sub);
  display:flex; align-items:center; gap:5px; cursor:pointer; padding:6px;
}
.hint-btn:disabled{opacity:.4; cursor:default}

.feedback{
  position:fixed; left:50%; transform:translateX(-50%); bottom:26px; z-index:60;
  background:var(--ink); color:#fff; padding:11px 20px; border-radius:14px; font-size:13.5px; font-weight:700;
  box-shadow:0 8px 24px rgba(0,0,0,.22); display:flex; align-items:center; gap:8px;
  animation:fbIn .25s ease; pointer-events:none; max-width:90%;
}
.feedback.ok{background:var(--green)}
.feedback.no{background:var(--red)}
@keyframes fbIn{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}

/* ---------- 存档弹窗 ---------- */
.mask{position:fixed; inset:0; z-index:9000; background:rgba(43,38,32,.42); display:flex; align-items:center; justify-content:center; padding:22px;}
.dlg{width:min(580px,100%); max-height:88vh; overflow:auto; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:24px 26px; box-shadow:0 24px 70px rgba(0,0,0,.26);}
.dlg h3{font-size:18px; font-weight:800; margin:0 0 10px}
.dlg p{font-size:12.5px; line-height:1.7; color:var(--sub); margin:0 0 10px}
.dlg p b{color:var(--ink)}
.dlg textarea{width:100%; box-sizing:border-box; height:112px; font:12px/1.55 ui-monospace,Consolas,monospace; border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:#FCFAF5; color:var(--ink); resize:vertical;}
.dlg textarea:focus{outline:none; border-color:var(--green); background:#fff}
.dlg-actions{display:flex; gap:10px; margin-top:14px}
.dlg-actions .btn{flex:1}
.dlg-file{font-size:12.5px; font-weight:700; color:var(--green); cursor:pointer; display:inline-block; margin-bottom:10px; text-decoration:underline}
.side-2col{display:flex; gap:8px}
.side-2col button{flex:1; width:auto; min-width:0}
.side-warn{font-size:11.5px; line-height:1.62; color:#A94236; background:#FDEDEA; border:1px solid #F3C9C2; border-radius:10px; padding:9px 11px; margin-bottom:10px;}

/* ---------- 奖励兑换 ---------- */
.nav-dot{margin-left:auto; min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--orange); color:#fff; font-size:10.5px; font-weight:800; display:inline-flex; align-items:center; justify-content:center;}
.rw-hero{background:linear-gradient(135deg,#FFF8EA,#FDEFD5); border:1px solid #F0DCB4; border-radius:18px; padding:18px 20px;}
.rw-num{font-size:32px; font-weight:800; color:#C4801B; line-height:1.1;}
.rw-hero{position:relative; overflow:hidden}
.rw-hero-label{font-size:12px; font-weight:800; color:#A08A5E; letter-spacing:.6px}
.rw-num-big{font-size:52px; font-weight:800; color:#C4801B; line-height:1.05; letter-spacing:-1px; margin-top:2px}
.rw-num-big span{font-size:14px; font-weight:800; color:#A08A5E; margin-left:7px; letter-spacing:0}
.rw-cannote{font-size:11.5px; color:#2F7A63; background:rgba(31,111,92,.08); border:1px solid rgba(31,111,92,.16); border-radius:9px; padding:7px 10px; margin-top:10px; line-height:1.6}
.rw-sub{font-size:12px; color:#8A7C5C; margin-top:5px;}
.rw-bar{height:8px; background:rgba(196,128,27,.14); border-radius:4px; overflow:hidden; margin-top:12px;}
.rw-bar i{display:block; height:100%; background:linear-gradient(90deg,#E9A32C,#F5C86B); border-radius:4px; transition:width .4s;}
.rw-list{display:flex; flex-direction:column; gap:10px;}
.rw-item{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 15px;}
.rw-item.ok{border-color:#CBE3C1; background:#FBFDF8;}
.rw-ic{width:38px; height:38px; flex:none; border-radius:11px; display:flex; align-items:center; justify-content:center; background:#F3EFE4; color:#A08F6C;}
.rw-item.ok .rw-ic{background:var(--green-l); color:var(--green);}
.rw-info{flex:1; min-width:0;}
.rw-info b{font-size:14px; font-weight:800; display:block;}
.rw-info span{font-size:11.5px; color:var(--sub); display:block; margin-top:3px;}
.rw-btn{flex:none; font-family:inherit; font-size:12.5px; font-weight:800; border-radius:10px; padding:9px 14px; border:1.5px solid var(--line); background:#fff; color:var(--sub); cursor:pointer;}
.rw-btn.can{background:var(--green); border-color:var(--green); color:#fff;}
.rw-btn:disabled{opacity:.65; cursor:default;}
.rw-log{display:flex; flex-direction:column; gap:8px;}
.rw-logrow{display:flex; align-items:center; gap:10px; font-size:12.5px; padding:10px 13px; background:#fff; border:1px solid var(--line); border-radius:11px;}

/* ---------- 奖励清单设置（家长填） ---------- */
.rwe-tip{font-size:12px; line-height:1.66; color:#6B5F44; background:#FBF7EE; border:1px solid #EFE4CC; border-radius:11px; padding:10px 12px; margin-bottom:11px}
.rwe-tip b{color:#A94236}
.rwe-head{display:flex; align-items:center; gap:8px; font-size:11px; font-weight:800; color:var(--sub); letter-spacing:.4px; padding:0 2px 6px}
.rwe-head .h1{flex:1}
.rwe-head .h2{width:82px; text-align:center; flex:none}
.rwe-head .h3{width:30px; flex:none}
.rwe-list{display:flex; flex-direction:column; gap:8px; max-height:min(304px,34vh); overflow:auto; padding:1px}
.rwe-row{display:flex; align-items:center; gap:8px}
.rwe-name{flex:1; min-width:0; font:13.5px/1.4 inherit; font-weight:700; border:1.5px solid var(--line); border-radius:10px; padding:10px 11px; background:#fff; color:var(--ink); box-sizing:border-box}
.rwe-cost{width:82px; flex:none; font:13.5px/1.4 inherit; font-weight:800; text-align:center; border:1.5px solid var(--line); border-radius:10px; padding:10px 6px; background:#FCFAF5; color:#B4853A; box-sizing:border-box}
.rwe-name:focus,.rwe-cost:focus{outline:none; border-color:var(--green); background:#fff}
.rwe-del{width:30px; height:30px; flex:none; border-radius:50%; border:1.5px solid var(--line); background:#fff; color:#B9B3A6; font-family:inherit; font-size:17px; font-weight:700; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center}
.rwe-del:hover{background:#FDEDEA; border-color:#F3C9C2; color:#A94236}
.rwe-add{width:100%; margin-top:10px; font-family:inherit; font-size:13px; font-weight:800; padding:11px; border-radius:11px; border:1.5px dashed #D9CFB8; background:#FCFAF5; color:#8A7C5C; cursor:pointer}
.rwe-add:hover{border-color:var(--green); color:var(--green); background:var(--green-l)}
.rwe-foot{font-size:11.5px; color:var(--sub); line-height:1.65; margin-top:12px}
.rwe-foot b{color:#B4853A}
/* 奖励设置弹窗：说明和按钮固定，中间列表自己撑满并滚动，保证按钮永远看得见 */
.dlg.dlg-reward{display:flex; flex-direction:column; overflow:hidden; height:min(88vh,720px); max-height:88vh}
.dlg-reward h3,.dlg-reward .rwe-tip,.dlg-reward .rwe-head,.dlg-reward .rwe-add,.dlg-reward .rwe-foot,.dlg-reward .dlg-actions{flex:none}
.dlg-reward .rwe-list{flex:1 1 auto; min-height:104px; max-height:none; overflow:auto; -webkit-overflow-scrolling:touch}
.dlg-reward .rwe-foot{margin-top:9px}
.dlg-reward .dlg-actions{margin-top:10px; padding-bottom:0}
/* 窗口很矮时（横屏手机、把浏览器窗口压扁）退回整体滚动，保证按钮和每一档都能看到 */
@media (max-height:620px){
  .dlg.dlg-reward{height:auto; max-height:88vh; overflow:auto}
  .dlg-reward .rwe-list{flex:none; min-height:110px; max-height:34vh}
}
/* 奖励页顶部的家长入口 */
.rw-editbar{display:flex; align-items:center; gap:9px; background:#FBF7EE; border:1px solid #EFE4CC; border-radius:12px; padding:10px 13px; margin-bottom:12px; cursor:pointer}
.rw-editbar:active{transform:scale(.995)}
.rw-editbar .ic{width:26px; height:26px; border-radius:9px; background:rgba(196,128,27,.12); color:#B4853A; display:flex; align-items:center; justify-content:center; flex:none}
.rw-editbar .tx{flex:1; font-size:11.5px; color:#8A7C5C; line-height:1.55}
.rw-editbar .tx b{display:block; font-size:12.5px; color:#6B5F44; margin-bottom:1px}
.rw-editbar .go{font-size:11.5px; font-weight:800; color:#B4853A; flex:none}

/* ---------- 进阶挑战 ---------- */
.rd-title{font-size:19px; font-weight:800; margin:4px 0 12px; line-height:1.35}
.rd-text{background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px 20px; font-size:14.5px; line-height:1.85; color:var(--ink)}
.rd-text p{margin:0 0 13px}
.rd-text p:last-child{margin-bottom:0}
.rd-qs{display:flex; flex-direction:column; gap:12px}
.rd-q{background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px}
.rd-qtext{font-size:14px; font-weight:700; line-height:1.6; margin-bottom:10px}
.rd-opts{display:flex; flex-direction:column; gap:8px}
.rd-opt{text-align:left; font-family:inherit; font-size:13px; line-height:1.5; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; background:#FCFAF5; color:var(--ink); cursor:pointer}
.rd-opt.on{border-color:var(--green); background:var(--green-l); font-weight:700}
.rd-opt.right{border-color:#2F8A5B; background:#E7F5EC; color:#1E6B45; font-weight:700}
.rd-opt.wrong{border-color:#E3B4AC; background:#FDEDEA; color:#A94236}
.rd-opt:disabled{cursor:default}
.rd-actions{margin:18px 0 32px}
.rd-actions .btn{width:100%}
.es-card{background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px 20px; margin-bottom:14px}
.es-card h3{font-size:16px; font-weight:800; margin:7px 0 9px; line-height:1.4}
.es-card p{font-size:13.5px; line-height:1.8; color:var(--sub); margin:0}
.es-points{margin-top:12px; font-size:13px; line-height:1.75; color:var(--ink)}
.es-points b{display:block; margin-bottom:4px}
.es-points ul{margin:0; padding-left:19px}
.es-starter{margin-top:12px; font-size:12.5px; line-height:1.7; background:#FBF7EE; border-radius:10px; padding:11px 13px; color:#6B5F44; white-space:pre-wrap}
.es-input{width:100%; box-sizing:border-box; height:230px; font:14.5px/1.7 inherit; border:1px solid var(--line); border-radius:14px; padding:14px 16px; background:#fff; color:var(--ink); resize:vertical}
.es-input:focus{outline:none; border-color:var(--green)}
.es-meta{display:flex; justify-content:space-between; font-size:12px; color:var(--sub); margin-top:8px}
.es-actions{display:flex; gap:10px; margin:16px 0 14px}
.es-actions .btn{flex:1}

/* ---------- 档案 ---------- */
.pg-wrap{max-width:520px; margin:5vh auto 0; padding:0 4px}
.pg-hero{text-align:center; margin-bottom:22px}
.pg-hero-emoji{font-size:44px; line-height:1; margin-bottom:10px; animation:pop .5s ease}
.pg-title{font-size:24px; font-weight:800; letter-spacing:.5px}
.pg-sub{font-size:12.5px; color:var(--sub); margin-top:8px; line-height:1.7}
.pg-list{display:flex; flex-direction:column; gap:12px}
.pg-card{display:flex; align-items:center; gap:14px; background:var(--card); border:1.5px solid var(--line); border-radius:18px; padding:15px 18px; cursor:pointer; transition:transform .18s ease, box-shadow .18s ease, border-color .18s; box-shadow:var(--shadow)}
.pg-card:hover{transform:translateY(-3px); box-shadow:0 12px 26px rgba(0,0,0,.1); border-color:#CFE3D9}
.pg-ava{width:52px; height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:26px; background:linear-gradient(135deg,#FFE9C9,#F7D9A8); flex:none}
.pg-info{flex:1; min-width:0}
.pg-info b{font-size:16px; font-weight:800; display:block}
.pg-info span{font-size:11.5px; color:var(--sub); display:block; margin-top:3px}
.pg-go{font-size:22px; color:#C9BFA8; font-weight:800}
.pg-del{
  flex:none; width:32px; height:32px; border-radius:50%; padding:0;
  border:1.5px solid var(--line); background:var(--card); color:#B9B3A6;
  font-family:inherit; font-size:19px; font-weight:700; line-height:1;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:background .15s, border-color .15s, color .15s;
}
.pg-del:hover{background:#FDEDEA; border-color:#F3C9C2; color:#A94236}
.pg-del:active{transform:scale(.94)}
.pg-edit{
  flex:none; width:32px; height:32px; border-radius:50%; padding:0;
  border:1.5px solid var(--line); background:var(--card); color:#B9B3A6;
  font-family:inherit; font-size:15px; font-weight:700; line-height:1;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:background .15s, border-color .15s, color .15s;
  margin-right:6px;
}
.pg-edit:hover{background:#EEF6F2; border-color:#CFE3D9; color:#1F6F5C}
.pg-edit:active{transform:scale(.94)}
.pg-new{width:100%; margin-top:18px}
.pg-back{width:100%; margin-top:10px}
.pf-input{width:100%; box-sizing:border-box; font:16px/1.5 inherit; border:1.5px solid var(--line); border-radius:14px; padding:14px 16px; background:#fff; color:var(--ink); text-align:center; font-weight:700}
.pf-input:focus{outline:none; border-color:var(--green); box-shadow:0 0 0 4px rgba(31,111,92,.08)}
.pf-label{font-size:12px; font-weight:800; color:var(--sub); margin:18px 0 9px; letter-spacing:.5px}
.pf-grades,.pf-emojis{display:flex; gap:9px; flex-wrap:wrap}
.pf-grade{flex:1; font-family:inherit; font-size:13.5px; font-weight:800; padding:12px 6px; border-radius:12px; border:1.5px solid var(--line); background:#fff; color:var(--sub); cursor:pointer; transition:.15s}
.pf-grade.on{background:var(--green); border-color:var(--green); color:#fff; transform:scale(1.02); box-shadow:0 6px 14px rgba(31,111,92,.2)}
.pf-emoji{width:52px; height:52px; font-size:23px; border-radius:14px; border:1.5px solid var(--line); background:#fff; cursor:pointer; transition:.15s}
.pf-emoji.on{border-color:var(--green); background:var(--green-l); transform:scale(1.06)}
.side-prof{display:flex; align-items:center; gap:10px; background:linear-gradient(135deg,#FFF6E6,#FDEFD8); border:1px solid #F2E0BC; border-radius:14px; padding:10px 12px; cursor:pointer; transition:transform .16s, box-shadow .16s}
.side-prof:hover{transform:translateY(-1px); box-shadow:0 6px 16px rgba(210,170,90,.18)}
.side-ava{width:34px; height:34px; border-radius:11px; background:#fff; display:flex; align-items:center; justify-content:center; font-size:19px; flex:none; box-shadow:0 2px 6px rgba(0,0,0,.06)}
.side-pinfo{flex:1; min-width:0}
.side-pinfo b{font-size:13px; font-weight:800; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.side-pinfo span{font-size:10.5px; color:#9A8A66; display:block; margin-top:1px}
.side-psw{font-size:10.5px; font-weight:800; color:#B4853A; flex:none}

/* ---------- 奖励进度（侧栏 + 首页） ---------- */
.side-rw{background:#fff; border:1px solid var(--line); border-radius:14px; padding:11px 13px 12px; cursor:pointer; transition:transform .16s, box-shadow .16s}
.side-rw:hover{transform:translateY(-1px); box-shadow:0 6px 16px rgba(196,128,27,.16)}
.sr-head{display:flex; align-items:baseline; justify-content:space-between; gap:6px}
.sr-head span{font-size:11px; font-weight:800; color:var(--sub); letter-spacing:.4px}
.sr-head i{font-size:10.5px; font-style:normal; font-weight:800; color:#B4853A}
.sr-bar{height:7px; background:rgba(196,128,27,.14); border-radius:4px; margin-top:8px; overflow:hidden}
.sr-bar i{display:block; height:100%; border-radius:4px; background:linear-gradient(90deg,#E9A32C,#F5C86B); transition:width .55s cubic-bezier(.3,.9,.3,1)}
.sr-tip{font-size:10.5px; color:var(--sub); margin-top:7px; line-height:1.55}
.sr-tip b{color:var(--orange); font-weight:800}

/* 首页奖励卡 */
.home-rw{position:relative; overflow:hidden; background:linear-gradient(135deg,#FFFCF3,#FDF1DC); border:1px solid #F2E0BC; border-radius:16px; padding:14px 16px 15px; margin-top:12px; cursor:pointer; transition:transform .16s, box-shadow .16s}
.home-rw:hover{transform:translateY(-2px); box-shadow:0 10px 24px rgba(196,128,27,.14)}
.home-rw::after{content:''; position:absolute; width:150px; height:150px; border-radius:50%; background:rgba(233,163,44,.1); top:-78px; right:-48px; pointer-events:none}
.hr-top{display:flex; align-items:center; gap:7px; position:relative; z-index:1}
.hr-top .hr-ic{width:24px; height:24px; border-radius:8px; background:rgba(233,163,44,.16); color:#C4801B; display:flex; align-items:center; justify-content:center; flex:none}
.hr-title{font-size:12px; font-weight:800; color:#8A6E3C; letter-spacing:.4px}
.hr-go{margin-left:auto; font-size:11.5px; font-weight:800; color:#B4853A; white-space:nowrap}
.hr-mid{display:flex; align-items:flex-end; gap:8px; margin-top:9px; position:relative; z-index:1}
.hr-num{font-size:33px; font-weight:800; color:#C4801B; line-height:1; letter-spacing:.5px}
.hr-unit{font-size:11.5px; font-weight:700; color:#A08A5E; padding-bottom:3px}
.hr-next{margin-left:auto; text-align:right; font-size:11px; color:#8A7C5C; line-height:1.5; padding-bottom:2px}
.hr-next b{font-size:15px; color:var(--orange); font-weight:800}
.hr-bar{height:9px; background:rgba(196,128,27,.15); border-radius:5px; margin-top:11px; overflow:hidden; position:relative; z-index:1}
.hr-bar i{display:block; height:100%; border-radius:5px; background:linear-gradient(90deg,#E9A32C,#F7CD74); transition:width .6s cubic-bezier(.3,.9,.3,1); box-shadow:0 0 10px rgba(233,163,44,.4)}
.hr-chips{display:flex; gap:7px; flex-wrap:wrap; margin-top:11px; position:relative; z-index:1}
.hr-chip{font-size:11px; font-weight:800; padding:4px 9px; border-radius:8px; background:#fff; border:1px solid #EBD8B4; color:#96743A; white-space:nowrap}
.hr-chip.ok{background:var(--green); border-color:var(--green); color:#fff}
.hr-chip.more{background:transparent; border-style:dashed; color:#A08A5E}
.hr-empty{font-size:11.5px; color:#96743A; margin-top:9px; position:relative; z-index:1}

/* ---------- 动效 ---------- */
body::before, body::after{content:''; position:fixed; border-radius:50%; filter:blur(70px); opacity:.45; pointer-events:none; z-index:0}
body::before{width:420px; height:420px; background:radial-gradient(circle,#FFE3B8,transparent 70%); top:-130px; left:-90px}
body::after{width:480px; height:480px; background:radial-gradient(circle,#CFE9DE,transparent 70%); bottom:-170px; right:-110px}
.side, #main{position:relative; z-index:1}
.side-brand{background:linear-gradient(120deg,#1F6F5C,#3E9C82 55%,#DE7A5C); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent}
.side-brand span{-webkit-text-fill-color:var(--sub); color:var(--sub)}
.lv{transition:transform .16s ease, box-shadow .16s ease, background .16s}
.lv:hover{transform:translateY(-3px) scale(1.04); box-shadow:0 10px 22px rgba(0,0,0,.1); z-index:2}
.lv.next{animation:breathe 1.9s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(222,122,92,.32)}50%{box-shadow:0 0 0 9px rgba(222,122,92,0)}}
.btn:active, .rw-btn:active, .pf-grade:active, .pf-emoji:active, .opt:active, .rd-opt:active{transform:scale(.97)}
#main.enter{animation:fadeUp .28s ease}
@keyframes fadeUp{from{opacity:0; transform:translateY(9px)} to{opacity:1; transform:none}}
@keyframes pop{from{opacity:0; transform:scale(.6)} to{opacity:1; transform:scale(1)}}

/* 关卡格子的层次感 */
.lv{height:58px; border-radius:14px}
.lv.done{background:linear-gradient(150deg,#EAF5EF,#D3E9DD); border-color:#BFDCD2}
.lv.done .lv-num{color:var(--green-d)}
.lv.next{background:linear-gradient(150deg,#FFF8F4,#FFE9E0)}
.lv.locked{background:#F3EEE4; border-color:#E8E0D2; opacity:.62}
.lv:hover .lv-num{transform:scale(1.12)}
.lv-num{transition:transform .16s ease}
.daily{position:relative; overflow:hidden}
.daily::after{content:''; position:absolute; width:280px; height:280px; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.18),transparent 68%); top:-130px; right:-70px; pointer-events:none}
.lv.next .lv-num{color:#C0562F}

/* 建档页：隐藏侧栏，内容居中 */
body.gate .side{display:none}
body.gate #main{width:100%; max-width:600px; margin:0 auto; padding:0 20px; display:flex; align-items:center; min-height:100vh; box-sizing:border-box}
body.gate .pg-wrap{width:100%; margin:0}
.pg-tips{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:18px}
.pg-tips div{background:#fff; border:1px solid var(--line); border-radius:14px; padding:13px 8px; text-align:center; box-shadow:var(--shadow)}
.pg-tips b{display:block; font-size:19px; font-weight:800; color:var(--green)}
.pg-tips span{display:block; font-size:11px; color:var(--sub); margin-top:3px}

/* ---------- 结算 ---------- */
.result{text-align:center; display:flex; flex-direction:column; justify-content:center; min-height:calc(100dvh - 210px)}
.res-stars{display:flex; justify-content:center; gap:10px; margin:14px 0 18px}
.res-star{width:52px; height:52px; opacity:0; transform:scale(.3); animation:starPop .45s forwards}
.res-star:nth-child(2){animation-delay:.16s}
.res-star:nth-child(3){animation-delay:.32s}
@keyframes starPop{to{opacity:1;transform:scale(1)}}
.res-title{font-size:23px; font-weight:800; margin-bottom:6px}
.res-sub{font-size:13.5px; color:var(--sub)}
.res-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin:20px 0}

/* ================= 存档（按档案隔离） ================= */
const SAVE_KEY = 'wbg_wordgame_v1';          /* 旧版单档键，仅用于迁移 */
const PROF_KEY = 'wbg_profiles';
let PROF = { list: [], cur: '', pin:'', pinHint:'' };   /* pin=家长安全密码，全局一个，跟档案一起落盘 */

function profileKey(id){ return 'wbg_wordgame_' + id; }
function saveProfiles(){
  try{ LS.setItem(PROF_KEY, JSON.stringify(PROF)); }catch(e){}
  fileMirror();
}
function loadProfiles(){
  try{
    const raw = LS.getItem(PROF_KEY);
    if(raw){
      const o = JSON.parse(raw);
      if(o && Array.isArray(o.list) && o.list.length){
        PROF = { list: o.list, cur: o.cur || o.list[0].id, pin:o.pin||'', pinHint:o.pinHint||'' };
      }
    }
  }catch(e){}
}
function curProfile(){ return PROF.list.filter(function(p){ return p.id === PROF.cur; })[0] || null; }
/* 年级：小学 3-6，初中 7-9 */
const GRADE_CN = {'3':'三年级','4':'四年级','5':'五年级','6':'六年级','7':'七年级','8':'八年级','9':'九年级'};
const STAGE_CN = {p:'小学篇', j:'初中篇'};
function isPrimary(g){ return ['3','4','5','6'].indexOf(String(g)) >= 0; }
function stageOfGrade(g){ return isPrimary(g) ? 'p' : 'j'; }
/* 找该年级第一册正课（不含总复习）的下标 */
function gradeBook(g){
  const gs = String(g);
  for(let i=0;i<BOOKS.length;i++){
    if(!BOOKS[i].review && BOOKS[i].grade === gs) return i;
  }
  return 0;
}
function gradeLabel(g){ return GRADE_CN[String(g)] || (isPrimary(g) ? '三年级' : '七年级'); }
function gradeName(g){ return gradeLabel(g); }

function defaultSave(){
  return {
    v:1, shards:0, streak:0, bestStreak:0, lastDay:'',
    levels:{}, badges:[], totalCorrect:0, spellCorrect:0, clearedWords:{},
    myMne:{}, earned:0, redeems:[], advanced:{reads:{}, essays:{}}, savedAt:0, seenIntro:false,
    /* 家长自己定的奖励清单：null = 用内置默认（老存档没有这个字段，也走默认） */
    rewards:null
  };
}
let S = defaultSave();
function pickSave(o){
  const s = Object.assign(defaultSave(), o);
  s.levels = o.levels||{}; s.badges = o.badges||[]; s.clearedWords = o.clearedWords||{}; s.myMne = o.myMne||{};
  s.redeems = Array.isArray(o.redeems) ? o.redeems : [];
  /* 老存档没有 rewards 字段 → null（用默认清单），不报错、不覆盖 */
  s.rewards = (Array.isArray(o.rewards) && o.rewards.length) ? o.rewards : null;
  const adv = o.advanced || {};
  s.advanced = { reads: adv.reads || {}, essays: adv.essays || {} };
  return s;
}
function loadSave(){
  const p = curProfile();
  const key = p ? profileKey(p.id) : SAVE_KEY;
  const keys = [key, key + '_bak'];
  for(let i=0;i<keys.length;i++){
    try{
      const raw = LS.getItem(keys[i]);
      if(!raw) continue;
      const o = JSON.parse(raw);
      if(!o || typeof o !== 'object') continue;
      S = pickSave(o);
      return;
    }catch(e){}
  }
  S = defaultSave();
}
function save(){
  const p = curProfile();
  if(!p) return;
  try{
    S.savedAt = Date.now();
    const t = JSON.stringify(S);
    const key = profileKey(p.id);
    LS.setItem(key, t);
    LS.setItem(key + '_bak', t);
  }catch(e){}
  fileMirror();
}

/* ================= 存档落盘（桌面版）=================
   浏览器 localStorage 绑在"这台电脑这个用户"上，换电脑就全没了。
   桌面版额外把全部档案写成一个真实文件，跟着文件夹走：
     程序目录\数据存档\进度.json  （主）
     %LOCALAPPDATA%\WordQuest\进度.json （备份，防程序目录只读或被覆盖）
   启动时两份都读，取 stamp 新的那份；浏览器里跑（没有桥）则跳过。
=================================================== */
const STAMP_KEY = 'wbg_stamp';

function fsApi(){
  try{
    if(window.pywebview && window.pywebview.api && window.pywebview.api.save_all) return window.pywebview.api;
  }catch(e){}
  return null;
}

function packAll(){
  const saves = {};
  PROF.list.forEach(function(p){
    try{
      const raw = LS.getItem(profileKey(p.id));
      if(raw) saves[p.id] = JSON.parse(raw);
    }catch(e){}
  });
  const stamp = Date.now();
  try{ LS.setItem(STAMP_KEY, String(stamp)); }catch(e){}
  return { v:1, stamp:stamp, profiles:PROF, saves:saves };
}

let fsTimer = null;
function fileMirror(){
  const api = fsApi();
  if(!api) return;
  if(fsTimer) clearTimeout(fsTimer);
  fsTimer = setTimeout(function(){
    fsTimer = null;
    try{ api.save_all(JSON.stringify(packAll())); }catch(e){}
  }, 120);
}

function fileFlush(){
  const api = fsApi();
  if(!api) return;
  if(fsTimer){ clearTimeout(fsTimer); fsTimer = null; }
  try{ api.save_all(JSON.stringify(packAll())); }catch(e){}
}

function localStamp(){
  try{ return parseInt(LS.getItem(STAMP_KEY) || '0', 10) || 0; }catch(e){ return 0; }
}

function applyPack(pack){
  if(!pack || !pack.profiles || !Array.isArray(pack.profiles.list) || !pack.profiles.list.length) return false;
  PROF = { list: pack.profiles.list, cur: pack.profiles.cur || pack.profiles.list[0].id, pin:pack.profiles.pin||'', pinHint:pack.profiles.pinHint||'' };
  try{ LS.setItem(PROF_KEY, JSON.stringify(PROF)); }catch(e){}
  const saves = pack.saves || {};
  for(const id in saves){
    try{
      const t = JSON.stringify(saves[id]);
      LS.setItem(profileKey(id), t);
      LS.setItem(profileKey(id) + '_bak', t);
    }catch(e){}
  }
  try{ LS.setItem(STAMP_KEY, String(pack.stamp || Date.now())); }catch(e){}
  return true;
}

function fileLoad(cb){
  const api = fsApi();
  if(!api){ if(cb) cb(false); return; }
  try{
    api.load_all().then(function(raw){
      let changed = false;
      try{
        if(raw){
          const pack = JSON.parse(raw);
          if((pack.stamp || 0) > localStamp()) changed = applyPack(pack);
        }
      }catch(e){}
      if(cb) cb(changed);
    }).catch(function(){ if(cb) cb(false); });
  }catch(e){ if(cb) cb(false); }
}

/* ================= 档案（一个孩子一份进度） ================= */
function initProfiles(){
  loadProfiles();
  if(PROF.list.length){
    if(!curProfile()){ PROF.cur = PROF.list[0].id; saveProfiles(); }
    return;
  }
  /* 首次运行：若存在旧版单档进度，自动建一个档案接管，不让已有进度丢 */
  let old = null;
  try{ old = LS.getItem(SAVE_KEY); }catch(e){}
  if(old){
    const id = 'p' + Date.now().toString(36);
    PROF = { list: [{ id:id, name:'我的档案', grade:'9', emoji:'🦊', createdAt:Date.now() }], cur:id };
    try{ LS.setItem(profileKey(id), old); }catch(e){}
    saveProfiles();
  }
}

      askParent(function(){ openRewardEditor({ first:true }); });

      openRewardEditor({ first:true });
    }
  }, 380);
}

function pickProfile(id){
  if(PROF.cur === id){ loadSave(); go('map'); return; }

  PROF.cur = id;

  currentBook = gradeBook(p ? p.grade : '9');
  go('map');
  toast('已切换到 ' + (p ? p.name : ''), 'ok');
}

/* ---------- 删除档案 ---------- */
function askDeleteProfile(id){
  const p = PROF.list.filter(function(x){ return x.id === id; })[0];
  if(!p) return;
  const isLast = PROF.list.length <= 1;
  const d = dialog(
    '<h3>删除「' + esc(p.name) + '」的档案？</h3>'
    + '<p>这个孩子的<b>单词进度、碎片、通关记录、已兑换奖励</b>会一起删掉，<b>删了不能恢复</b>。</p>'
    + (isLast

        : '<p>如果是名字打错了，建议<b>先新建一个正确的档案</b>，确认能用了再回来删这个。</p>')
    + '<div class="dlg-actions">'
    + '<button class="btn btn-ghost" id="dlgCancel">不删了</button>'
    + '<button class="btn btn-danger" id="dlgDel">确认删除</button>'
    + '</div>'
  );
  d.q('#dlgCancel').onclick = d.close;
  d.q('#dlgDel').onclick = function(){
    d.close();
    deleteProfile(id);
  };

function deleteProfile(id){
  const p = PROF.list.filter(function(x){ return x.id === id; })[0];
  if(!p) return;
  const wasCur = (PROF.cur === id);

  PROF.list = PROF.list.filter(function(x){ return x.id !== id; });

  /* 正本和备份两份都要清掉，不然下次可能被 _bak 复活 */
  try{ LS.removeItem(profileKey(id)); }catch(e){}
  try{ LS.removeItem(profileKey(id) + '_bak'); }catch(e){}

  if(!PROF.list.length){
    PROF.cur = '';
    /* 最后一个档案也删了，密码一并清掉，下次建档案时让家长重新设 */
    PROF.pin = ''; PROF.pinHint = '';
    /* 直接清掉档案索引：留着空列表，下次启动会误判成"从没建过档案" */
    try{ LS.removeItem(PROF_KEY); }catch(e){}
    S = defaultSave();
    showProfileForm();
    toast('档案已删除，重新建一个吧', '');
    return;
  }

  if(wasCur){
    PROF.cur = PROF.list[0].id;
    saveProfiles();
    S = defaultSave();
    loadSave();
    const np = curProfile();
    currentBook = gradeBook(np ? np.grade : '9');
  } else {
    saveProfiles();
  }

  showProfileGate(false);

function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ================= 音效 ================= */
let AC = null, muted = (LS.getItem('wbg_muted')==='1');
function beep(freq, dur, type, vol){
  if(muted) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type||'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(vol||0.12, AC.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+dur+0.02);
  }catch(e){}
}
const SFX = {
  ok(){ beep(660,.12,'sine',.1); setTimeout(()=>beep(880,.14,'sine',.09),90); },
  no(){ beep(200,.18,'triangle',.1); },
  flip(){ beep(420,.06,'sine',.05); },
  clear(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.18,'sine',.1), i*110)); },
  badge(){ [784,988,1175].forEach((f,i)=>setTimeout(()=>beep(f,.22,'sine',.09), i*130)); }
};

/* ================= 发音（浏览器 TTS，无需音频文件） ================= */
const TTS = {
  ok: false, voice: null, acc: 'gb', rate: 0.85, on: true,
  init(){
    this.acc = LS.getItem('wbg_voice_acc') || 'gb';
    this.on  = LS.getItem('wbg_voice_on') !== '0';
    const r = parseFloat(LS.getItem('wbg_voice_rate'));
    if(!isNaN(r)) this.rate = r;
    if(!('speechSynthesis' in window)) return;
    const pick = () => {
      const all = window.speechSynthesis.getVoices() || [];
      const en = all.filter(v => /^en([-_]|$)/i.test(v.lang));
      if(!en.length) return;
      this.voice = en.find(v => /en[-_]GB/i.test(v.lang)) || en[0];
      this.ok = true;
    };
    pick();
    window.speechSynthesis.onvoiceschanged = pick;
  },
  label(){ return this.acc === 'gb' ? '英式' : (this.acc === 'us' ? '美式' : '关闭'); },
  cycle(){
    this.acc = this.acc === 'gb' ? 'us' : (this.acc === 'us' ? 'off' : 'gb');
    this.on = this.acc !== 'off';
    LS.setItem('wbg_voice_acc', this.acc);
    LS.setItem('wbg_voice_on', this.on ? '1' : '0');
    if(this.acc !== 'off'){ this.pickAccent(); this.playText('hello'); }
    return this.label();
  },
  pickAccent(){
    if(!('speechSynthesis' in window)) return;
    const all = window.speechSynthesis.getVoices() || [];
    const want = this.acc === 'gb' ? /en[-_]GB/i : /en[-_]US/i;
    const hit = all.filter(v => /^en([-_]|$)/i.test(v.lang));
    this.voice = hit.find(v => want.test(v.lang)) || hit[0] || null;
  },
  cache: {},
  playText(text){
    // 优先用内置音频（自然音质、离线），没有再退回系统语音
    if(!this.on) return false;
    const key = String(text).toLowerCase();
    const idx = (typeof AMAP !== 'undefined') ? AMAP[key] : undefined;
    if(idx !== undefined && typeof AUDIO !== 'undefined' && AUDIO[idx]){
      try{
        let a = this.cache[idx];
        if(!a){ a = new Audio('data:audio/mpeg;base64,' + AUDIO[idx]); this.cache[idx] = a; }
        a.currentTime = 0;
        const p = a.play();
        if(p && p.catch) p.catch(() => { if(!this._blockTip){ this._blockTip = 1; toast('点一下页面任意位置，发音就正常了'); } this.say(text); });
        return true;
      }catch(e){ /* 落到 TTS */ }
    }
    return this.say(text);
  },
  say(text){
    if(!this.on) return false;
    if(!('speechSynthesis' in window)) { toast('这个浏览器不支持语音朗读'); return false; }
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      if(this.voice) u.voice = this.voice;
      u.lang = (this.voice && this.voice.lang) || (this.acc === 'us' ? 'en-US' : 'en-GB');
      u.rate = this.rate;
      u.pitch = 1;
      window.speechSynthesis.speak(u);
      return true;
    }catch(e){ return false; }
  }
};

/* ================= 地图 ================= */
function levelStars(id){ const r = S.levels[id]; return r && r.done ? r.stars : 0; }
function isUnlocked(level){
  if(level.inBook === 1) return true;
  const prev = LEVELS_BY_BOOK[level.bookIdx].find(l => l.inBook === level.inBook-1);
  return !!(prev && S.levels[prev.id] && S.levels[prev.id].done);
}
function nextLevelSuggestion(){
  /* 先找当前册，再找档案对应年级的册；兜底也只在**本学段**内找，不能跨到另一边 */
  const p = curProfile();
  const order = [currentBook, gradeBook(p ? p.grade : '9')];
  for(let i = 0; i < order.length; i++){
    const list = LEVELS_BY_BOOK[order[i]] || [];
    for(const lv of list){
      if(isUnlocked(lv) && !(S.levels[lv.id] && S.levels[lv.id].done)) return lv;
    }
  }
  const st = myStage();
  for(const lv of LEVELS){
    if(BOOKS[lv.bookIdx].stage !== st) continue;
    if(isUnlocked(lv) && !(S.levels[lv.id] && S.levels[lv.id].done)) return lv;
  }
  return null;
}
function renderStars(n, size){
  let h = '';
  for(let i=0;i<3;i++){
    h += `<svg viewBox="0 0 24 24" width="${size}" height="${size}" style="fill:${i<n?'#F0B03F':'#DDD5C6'}"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9L12 3z"/></svg>`;
  }
  return h;
}

  if(alb) alb.onclick = () => go('album');
  const cta = main.querySelector('.daily-cta');
  if(cta) cta.onclick = () => { const lv = LEVEL_MAP[cta.dataset.lv]; if(lv) startLevel(lv); };
  const hrw = main.querySelector('#homeRw');
  if(hrw) hrw.onclick = () => go('rewards');
}

/* ================= 开始关卡 ================= */

  flashIdx = 0;
  forgotList = [];
  viewFlash(lv.id);
  renderHUD();
}

function advanceFlash(isForgot){
  if(isForgot) forgotList.push(flashList[flashIdx]);
  flashIdx++;
  if(flashIdx >= flashList.length){ beginQuiz(); return; }
  viewFlash(currentLevelId);

/* ================= 答题 ================= */
let currentLevelId = null;
let queue = [], qIdx = 0, correctCount = 0, combo = 0, maxCombo = 0, earnedShards = 0, wrongWords = [], locked = false;
let spellCorrectThisRun = 0;
let hintUsedThisQ = false;

function beginQuiz(){
  const lv = LEVEL_MAP[currentLevelId];
  queue = [];
  lv.words.forEach(w => {
    queue.push({t:'spell', w});
    queue.push({t:'choice', w, opts: makeOptions(w)});
  });
  forgotList.forEach(w => queue.push({t:'spell', w, extra:true}));
  queue = shuffle(queue);
  qIdx = 0; correctCount = 0; combo = 0; maxCombo = 0; earnedShards = 0; wrongWords = []; locked = false; spellCorrectThisRun = 0;
  run = {level: lv, total: queue.length};
  main.classList.add('no-scroll');
  renderQuiz();
}

function makeOptions(w){
  const seen = new Set([w.c]);
  const pool = WORDS.filter(x => {
    if(x.b !== w.b || seen.has(x.c)) return false;
    seen.add(x.c); return true;
  });
  const target = w.c.length;
  const near = pool.slice().sort((a,b)=>Math.abs(a.c.length-target)-Math.abs(b.c.length-target)).slice(0,14);
  const picks = shuffle(near).slice(0,3);
  return shuffle([w, ...picks]);
}

function renderQuiz(){
  if(qIdx >= queue.length){ finishLevel(); return; }
  const q = queue[qIdx];
  locked = false;          /* 每道新题才解锁；不要在判分后提前解锁，否则会重复计分 */
  hintUsedThisQ = false;
  const pct = Math.round(qIdx/queue.length*100);
  const w = q.w;
  let qTop = '', qBottom = '';

  if(q.t === 'spell'){
    const letters = w.e.replace(/[\s-]/g,'').length;
    qTop = `<div class="q-box">
        <div class="q-prompt">写出对应的英文</div>
        <div class="q-cn ${w.c.length>14?'long':''}">${esc(w.c)}</div>
        <div class="q-meta">${esc(w.p||'')}${w.p?' · ':''}<b>${letters}</b> 个字母${w.e.includes(' ')?' · 词组，中间有空格':(w.e.includes('-')?' · 含连字符':'')}</div>
      </div>`;
    qBottom = `<div class="spell-display" id="spellDisp"></div>
      <div class="spell-hintline" id="spellHintLine">直接敲键盘，一个字母一个字母地填</div>
      <div class="spell-actions">
        <button class="btn btn-ghost btn-sm" id="btnSpellClear">清空</button>
        <button class="btn btn-primary" id="btnSubmit" style="padding:11px 28px">确定</button>
      </div>
      <div class="hint-row">
        <button class="hint-btn" id="btnHint">${svg('bulb',14)} 提示首字母（${HINT_COST} 碎片）</button>
      </div>`;
  } else {
    qTop = `<div class="q-box">
        <div class="q-prompt">选出正确的中文意思</div>
        <div class="q-word ${w.e.length>12?'long':''}">${esc(w.e)}</div>
        <div class="q-meta">${esc(w.p||'')}<button class="tts-mini" data-say="${esc(w.e)}" title="听发音">${svg('speaker',16)}</button></div>
      </div>`;
    qBottom = `<div class="opts" id="opts">
        ${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="opt-key">${'ABCD'[i]}</span><span>${esc(o.c)}</span></button>`).join('')}
      </div>`;
  }

  main.innerHTML = `
    <div class="topbar" style="margin-bottom:10px">
      <div class="icon-btn" id="btnQuit">${svg('close',17)}</div>
      <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="bar-label">${qIdx+1}/${queue.length}</div>
    </div>
    <div class="q-head">
      <span class="q-tag ${q.t}">${q.t==='spell'?'拼写 · 中译英':'选择 · 英译中'}</span>
      <span class="q-combo ${combo>=3?'on':''}">连对 ${combo} 题</span>
    </div>
    <div class="stage ${q.t==='spell'?'stage-spell':''}">
      <div class="q-top">${qTop}</div>
      <div class="q-bottom">${qBottom}</div>
    </div>
  `;

  $('#btnQuit').onclick = () => { if(confirm('退出本关，进度不保存，确定吗？')) go('map'); };

  if(q.t === 'spell'){
    bindSpellPad(w);
  } else {
    main.querySelectorAll('.opt').forEach(btn => {
      btn.onclick = () => { if(locked) return; judgeChoice(q.opts[+btn.dataset.i], w, btn); };
    });
  }

  main.querySelectorAll('[data-say]').forEach(b => {
    b.onclick = (e) => { e.stopPropagation(); TTS.playText(b.dataset.say); };
  });
}

/* ================= 拼写键盘（不用 input，输入法无从联想） ================= */
let padBuf = '', padKeyHandler = null, padActive = false;

function unbindSpellPad(){
  padActive = false;
  if(padKeyHandler){ document.removeEventListener('keydown', padKeyHandler); padKeyHandler = null; }
}

function bindSpellPad(w){
  const disp = $('#spellDisp');
  const total = w.e.length;
  padBuf = '';
  padActive = true;

  function draw(){
    let h = '';
    for(let i=0;i<total;i++){
      const ch = w.e[i];
      if(ch === ' '){ h += `<div class="slot gap"></div>`; continue; }
      const typed = padBuf[i];
      const isCaret = (i === padBuf.length && padBuf.length < total);
      h += `<div class="slot ${typed?'filled':''} ${isCaret?'caret':''}">${typed ? esc(typed) : ''}</div>`;
    }
    disp.innerHTML = h;
    const hl = $('#spellHintLine');
    if(hl){
      const left = total - padBuf.length;
      hl.innerHTML = padBuf.length >= total
        ? '拼完了，点「确定」或按回车'
        : `已输入 <b>${padBuf.length}</b> / ${total} 个字母`;
    }
  }

  function push(ch){
    if(locked || padBuf.length >= total) return;
    const need = w.e[padBuf.length];
    /* 空格和连字符必须对位：这个词这里没有空格，按空格就没反应，避免乱按凑长度 */
    if(need === ' ' && ch !== ' '){ shake(); return; }
    if(need === '-' && ch !== '-'){ shake(); return; }
    if(need !== ' ' && need !== '-' && (ch === ' ' || ch === '-')){ shake(); return; }
    padBuf += ch;
    SFX.flip();
    draw();
  }

  function back(){
    if(locked || !padBuf.length) return;
    padBuf = padBuf.slice(0, -1);
    draw();
  }

  function submit(){
    if(locked) return;
    if(!padBuf.length){ toast('还没拼呢', 'no'); return; }
    judgeSpell(padBuf, w, disp);
  }

  function shake(){
    SFX.no();
    disp.classList.remove('shake');
    void disp.offsetWidth;
    disp.classList.add('shake');
  }

  const clearBtn = $('#btnSpellClear');
  if(clearBtn) clearBtn.onclick = () => {
    if(locked) return;
    padBuf = '';
    draw();
  };
  const okBtn = $('#btnSubmit');
  if(okBtn) okBtn.onclick = submit;

  /* 物理键盘：只接受单个字母、空格、连字符；输入法组合键一律丢弃 */
  if(padKeyHandler) document.removeEventListener('keydown', padKeyHandler);
  padKeyHandler = function(e){
    if(!padActive || locked) return;
    if(e.isComposing || e.keyCode === 229) return;   // 输入法正在组词
    if(e.ctrlKey || e.altKey || e.metaKey) return;
    if(e.key === 'Enter'){ e.preventDefault(); submit(); return; }
    if(e.key === 'Backspace'){ e.preventDefault(); back(); return; }
    if(e.key === ' '){ e.preventDefault(); push(' '); return; }
    if(e.key === '-'){ e.preventDefault(); push('-'); return; }
    if(e.key.length === 1 && /[a-zA-Z]/.test(e.key)){ push(e.key.toLowerCase()); }
  };
  document.addEventListener('keydown', padKeyHandler);

  const hi = $('#btnHint');
  if(hi) hi.onclick = () => {
    if(hintUsedThisQ) return;
    if(S.shards < HINT_COST){ toast('碎片不够，答几题攒一点'); return; }
    hintUsedThisQ = true;
    addShards(-HINT_COST);
    SFX.flip();
    /* 提示只给首字母，且直接落到格子里，孩子无法一次拿到整词 */
    if(!padBuf.length) push(w.e[0]);
    const masked = w.e.split('').map((ch,i)=> i===0 ? ch : (ch===' '?' ':(ch==='-'?'-':'·'))).join('');
    hi.disabled = true;
    hi.innerHTML = `首字母：<b style="color:var(--ink);letter-spacing:3px;margin-left:4px">${esc(masked)}</b>`;
  };

  draw();
}

function markAnswer(isRight, correctText){
  if(isRight){
    correctCount++; combo++; maxCombo = Math.max(maxCombo, combo);
    const bonus = SHARD_PER_CORRECT;
    earnedShards += bonus;
    S.totalCorrect++;
    SFX.ok();
    showFeedback(true, `答对了  +${bonus} 碎片`);
  } else {
    combo = 0;
    wrongWords.push(queue[qIdx].w);
    SFX.no();
    showFeedback(false, `正确答案：${correctText}`);
  }
  save();
  qIdx++;
  setTimeout(()=>{
    if(qIdx >= queue.length) finishLevel();
    else renderQuiz();
  }, isRight ? 620 : 1250);
}

function judgeSpell(val, w, input){
  if(locked) return;
  locked = true;
  const ok = norm(val) === norm(w.e);
  input.classList.add(ok?'right':'wrong');
  const cb = $('#btnSpellClear'); if(cb) cb.disabled = true;
  const ob = $('#btnSubmit'); if(ob) ob.disabled = true;
  /* 交卷即摘键盘：判分后还有 200ms 解锁窗口，若键盘还挂着，连按回车会重复计分 */
  unbindSpellPad();
  if(ok) spellCorrectThisRun++;
  markAnswer(ok, w.e);
  TTS.playText(w.e);
  /* 不在这里解锁：等下一题 renderQuiz 时再解，否则 200ms~620ms 之间再点一次会重复计分 */
}

function judgeChoice(pick, w, btn){
  locked = true;
  const ok = pick.i === w.i;
  const all = main.querySelectorAll('.opt');
  all.forEach(b => {
    const o = queue[qIdx].opts[+b.dataset.i];
    if(o.i === w.i) b.classList.add('right');
    else if(b === btn && !ok) b.classList.add('wrong');
    else b.classList.add('dim');
    b.onclick = null;
  });
  markAnswer(ok, w.c);
  /* 同上：留给下一题的 renderQuiz 解锁 */
}

function showFeedback(ok, msg){
  const old = document.querySelector('.feedback');
  if(old) old.remove();
  const d = document.createElement('div');
  d.className = 'feedback ' + (ok?'ok':'no');
  d.innerHTML = `${svg(ok?'check':'cross',15)}<span>${esc(msg)}</span>`;
  document.body.appendChild(d);
  setTimeout(()=>{ if(d.parentNode) d.remove(); }, ok?900:1500);
}

/* ================= 通关结算 ================= */
function finishLevel(){
  unbindSpellPad();
  const lv = run.level;
  const total = queue.length;
  const acc = correctCount/total;
  const passed = acc >= PASS_RATE;
  let stars = 0;
  if(acc >= 1) stars = 3;
  else if(acc >= 0.8) stars = 2;
  else if(acc >= 0.6) stars = 1;

  // 防刷：重刷已通关的关卡给 50% 答题碎片，通关/三星奖励只发第一次
  // 总复习册本来就是第二轮，同样按复习模式算，避免同一批词领两次全奖
  const prevLv = S.levels[lv.id];
  const isReviewBook = !!lv.review;
  const firstClear = !isReviewBook && !(prevLv && prevLv.done);
  /* 星级梯度奖励只在首通发，重刷不重复发，防止刷分 */
  let shardGain = firstClear ? earnedShards : Math.floor(earnedShards * 0.5);
  if(passed && firstClear) shardGain += (SHARD_STAR[stars] || 0);

  // 打卡 & 连击
  let streakUp = false;
  if(passed){
    const t = today();
    if(S.lastDay !== t){
      if(S.lastDay && dayDiff(S.lastDay, t) === 1) S.streak++;
      else S.streak = 1;
      S.lastDay = t;
      S.todayCount = 1;          /* 换了一天就从 1 开始算，不能接着昨天的累加 */
      streakUp = true;
      S.bestStreak = Math.max(S.bestStreak||0, S.streak);
    } else {
      S.todayCount = (S.todayCount||0) + 1;
    }
  }

  // 记录关卡
  if(passed){
    const prev = S.levels[lv.id];
    if(!prev || prev.stars < stars || !prev.done){
      S.levels[lv.id] = {done:true, stars: Math.max(stars, prev?prev.stars:0), acc: Math.max(acc, prev?prev.acc:0)};
    }
    lv.words.forEach(w => { S.clearedWords[w.i] = 1; });
    S.spellCorrect = (S.spellCorrect||0) + spellCorrectThisRun;
  }

  addShards(shardGain);

  // 徽章判定
  const newBadges = [];
  const grant = id => { if(!S.badges.includes(id)){ S.badges.push(id); newBadges.push(id); } };
  if(passed && clearedLevels() >= 1) grant('first');
  if(passed && acc >= 1) grant('perfect');
  if(maxCombo >= 15) grant('combo');
  if(clearedCount() >= 100) grant('hundred');
  if(S.streak >= 7) grant('streak7');
  if((S.spellCorrect||0) >= 200) grant('spell200');
  const st = myStage();
  const firstBook = gradeBook(curProfile() ? curProfile().grade : (st === 'p' ? '3' : '7'));
  const bFirst = LEVELS_BY_BOOK[firstBook] || [];
  if(bFirst.length && bFirst.every(l => S.levels[l.id] && S.levels[l.id].done)) grant('book7a');
  /* 「词汇王者」按本学段**正课**全通算（与旅游奖励、进阶解锁同一口径），不含总复习册 */
  const stageLvs = LEVELS.filter(l => BOOKS[l.bookIdx].stage === st && !BOOKS[l.bookIdx].review);
  if(stageLvs.every(l => S.levels[l.id] && S.levels[l.id].done)) grant('all');

  if(newBadges.length){ SFX.badge(); } else if(passed){ SFX.clear(); }
  save();

  viewResult({ lv, acc, passed, stars, shardGain, total, correctCount, maxCombo, newBadges, firstClear });
  renderHUD();
}

function viewResult(r){
  main.classList.remove('no-scroll');
  const {lv, acc, passed, stars, shardGain, total, correctCount, maxCombo, newBadges, firstClear} = r;
  const nextLv = LEVELS_BY_BOOK[lv.bookIdx].find(l => l.inBook === lv.inBook+1);

  const badgeHtml = newBadges.map(id => {
    const b = BADGES.find(x=>x.id===id);
    return `<div class="badge-pop">${svg(b.icon,34,'bicon')}<div><h4>解锁徽章 · ${b.name}</h4><p>${b.desc}</p></div></div>`;
  }).join('');

  main.innerHTML = `
    <div class="result">
      <div class="res-stars">
        ${[0,1,2].map(i=>`<div class="res-star">${svg('star', i<stars?52:52, '')}</div>`).join('')}
      </div>
      <div class="res-title">${passed ? (stars===3?'完美通关':(stars===2?'顺利通关':'压线通关')) : '这关没过'}</div>
      <div class="res-sub">${passed ? '已掌握本关 '+lv.words.length+' 个单词' : '正确率要过 60% 才算通关，再试一次'}</div>

      <div class="res-grid">
        <div class="res-cell"><b style="white-space:nowrap">${correctCount}/${total}</b><span>答对题数</span></div>
        <div class="res-cell"><b>${Math.round(acc*100)}%</b><span>正确率</span></div>
        <div class="res-cell"><b>+${shardGain}</b><span>获得碎片</span></div>
      </div>
      <div style="font-size:12px;color:var(--sub);margin-top:9px">
        ${!firstClear ? (lv.review ? '总复习模式：碎片按 50% 计，不重复发通关奖励' : '复习模式：碎片按 50% 计，星级奖励只发第一次') : ('三星才给满额 ' + SHARD_STAR[3] + ' 片（一星' + SHARD_STAR[1] + ' / 两星' + SHARD_STAR[2] + '）· ' + nextRewardTip())}
      </div>

      ${maxCombo>=3?`<div style="font-size:12.5px;color:var(--sub);margin-top:-6px">本关最高连对 <b style="color:var(--orange)">${maxCombo}</b> 题</div>`:''}
      ${badgeHtml}

      <div class="res-actions">
        ${passed && nextLv ? `<button class="btn btn-primary" id="btnNext">进入第 ${nextLv.no} 关</button>` : ''}
        <div class="row">
          <button class="btn btn-ghost" id="btnRetry">${passed?'再刷一次':'重新挑战'}</button>
          <button class="btn btn-ghost" id="btnBackMap">回到地图</button>
        </div>
      </div>
    </div>
  `;

  // 星星着色
  const starEls = main.querySelectorAll('.res-star svg path');
  starEls.forEach((p,i) => { p.style.fill = i<stars ? '#F0B03F' : '#E3DCCD'; });

}

/* ================= 奖励兑换 ================= */
/* 当前档案真正生效的奖励清单：家长定过就用家长的，没定过用默认 */
function myRewards(){
  if(Array.isArray(S.rewards) && S.rewards.length) return S.rewards;
  return REWARDS;
}
function isCustomRewards(){ return Array.isArray(S.rewards) && S.rewards.length > 0; }
function sortRewards(){ return myRewards().slice().sort((a,b)=>a.cost-b.cost); }
function affordableCount(){ return myRewards().filter(r => S.shards >= r.cost).length; }
function nextRewardBadge(){
  const n = affordableCount();
  return n > 0 ? '<span class="nav-dot">' + n + '</span>' : '';
}
function nextReward(){ return sortRewards().find(r => S.shards < r.cost) || null; }

/* 统一算「距离下一档还差多少」，三个地方共用 */
function rewardProgress(){
  const cur = S.shards || 0;
  const nr = nextReward();
  const prevCost = (function(){
    const lower = sortRewards().filter(r => r.cost <= cur);
    return lower.length ? lower[lower.length - 1].cost : 0;
  })();
  if(!nr) return { cur, next:null, need:0, pct:100, prevCost, span:0 };
  const span = nr.cost - prevCost;
  const pct = span > 0 ? Math.min(100, Math.round((cur - prevCost) / span * 100)) : 100;
  return { cur, next:nr, need:nr.cost - cur, pct:Math.max(0, pct), prevCost, span };
}
function nextRewardTip(){
  const nr = nextReward();
  if(!nr) return '奖励已经全部能换了';
  return '再攒 ' + (nr.cost - S.shards) + ' 碎片，可以换「' + nr.name + '」';
}
function fmtAt(t){
  const d = new Date(t);
  return (d.getMonth()+1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

function redeem(id){
  const r = myRewards().find(x => x.id === id);
  if(!r) return;
  if(S.shards < r.cost){ toast('碎片不够，还差 ' + (r.cost - S.shards), 'no'); return; }
  if(!confirm('用 ' + r.cost + ' 碎片换「' + r.name + '」？\n兑换后碎片会扣掉，记得找家长领取。')) return;
  S.shards -= r.cost;
  S.redeems = S.redeems || [];
  S.redeems.unshift({ id:r.id, name:r.name, cost:r.cost, at:Date.now() });
  if(S.redeems.length > 100) S.redeems.length = 100;
  save(); bumpShard(); SFX.badge();
  toast('兑换成功，找家长领「' + r.name + '」', 'ok');
  viewRewards();
}

/* ================= 家长安全密码 =================
   为什么不用算术题：初中的孩子都能算出来，挡不住。
   改成家长自己设的密码：孩子不知道密码就改不了奖励清单。
   密码存在 PROF.pin（全局一个），跟档案一起写进进度.json，换电脑不丢。
============================================================ */
function askParent(cb){
  const hasPin = !!(PROF.pin && String(PROF.pin).length >= 4);
  const d = dialog(
    '<h3>' + (hasPin ? '这一页请家长来操作' : '第一次改奖励，先设个安全密码') + '</h3>'
    + '<div class="rwe-tip">'
    + (hasPin
       ? '这里定的是「孩子攒多少碎片，能换什么东西」，要家长掏钱或掏时间兑现，所以<b>只有知道密码的家长能改</b>。'
       : '设一个只有家长知道的密码（4 位以上，数字字母都行）。以后孩子想改奖励，就得先来问家长要密码。<br><b>请记住它，再填一句孩子猜不到的提示。</b>')
    + '</div>'
    + (hasPin
       ? '<input class="pf-input" id="paAns" type="password" maxlength="24" placeholder="输入家长密码" style="margin-top:12px">'
         + '<div style="margin-top:8px"><span id="paForgot" style="font-size:12px;color:var(--blue);cursor:pointer;text-decoration:underline">忘了密码？点这里看提示</span>'
         + '<div id="paHintBox" style="font-size:12px;color:#A94236;margin-top:5px;min-height:14px"></div></div>'
       : '<input class="pf-input" id="paNew" type="password" maxlength="24" placeholder="设置密码（4 位以上）" style="margin-top:12px">'
         + '<input class="pf-input" id="paNew2" type="password" maxlength="24" placeholder="再输一遍确认" style="margin-top:8px">'
         + '<input class="pf-input" id="paHint" maxlength="30" placeholder="提示语（必填，别让孩子猜到）" style="margin-top:8px">')
    + '<div class="dlg-actions"><button class="btn btn-primary" id="paOk">' + (hasPin ? '确认是我' : '设置密码并开始') + '</button>'
    + '<button class="btn btn-ghost" id="paCancel">取消</button></div>'
  );
  const focus = function(id){ setTimeout(function(){ const el=d.q(id); if(el){ try{el.focus();}catch(e){} } }, 80); };
  focus(hasPin ? '#paAns' : '#paNew');

  if(hasPin){
    const fg = d.q('#paForgot');
    if(fg) fg.onclick = function(){
      const box = d.q('#paHintBox');
      if(box) box.textContent = '密码提示：' + (PROF.pinHint || '（当初没填提示语）');
    };
  }

  d.q('#paOk').onclick = function(){
    if(!hasPin){
      const p1 = (d.q('#paNew').value || '').trim();
      const p2 = (d.q('#paNew2').value || '').trim();
      const hint = (d.q('#paHint').value || '').trim();
      if(p1.length < 4){ toast('密码至少 4 位', 'no'); focus('#paNew'); return; }
      if(p1 !== p2){ toast('两次输得不一样，再输一次', 'no'); d.q('#paNew2').value=''; focus('#paNew2'); return; }
      if(!hint){ toast('请填一句提示语，忘了密码时要用', 'no'); focus('#paHint'); return; }
      PROF.pin = p1; PROF.pinHint = hint;
      saveProfiles();
      d.close(); toast('密码设好了，请记住', 'ok'); cb();
      return;
    }
    const ans = (d.q('#paAns').value || '').trim();
    if(ans !== String(PROF.pin)){
      toast('密码不对，再试一次', 'no');
      d.q('#paAns').value = ''; focus('#paAns');
      return;
    }
    d.close(); cb();
  };
  d.q('#paCancel').onclick = d.close;
  const enterEl = d.q(hasPin ? '#paAns' : '#paHint');
  if(enterEl) enterEl.onkeydown = function(e){ if(e.key === 'Enter') d.q('#paOk').click(); };
}

function openRewardEditor(opts){
  opts = opts || {};
  const first = !!opts.first;                 /* 新建档案后的第一次引导 */
  const who = (curProfile() && curProfile().name) ? curProfile().name : '孩子';
  let list = myRewards().map(function(r, i){
    return { id: r.id || ('x'+i), name: r.name, cost: r.cost, icon: r.icon || REWARD_ICONS[i % REWARD_ICONS.length] };
  });

  const d = dialog(
    '<h3>' + (first ? ('给「' + esc(who) + '」定奖励') : '奖励清单') + '</h3>'
    + '<div class="rwe-tip">'
    +   '<b>怎么定才管用：</b><br>'
    +   '① 第一档压到 100 上下（一关满星约 104 碎片），让他第一次通关就能换到。<br>'
    +   '② 别一上来给大件。<b>不建议大额现金</b>——钱给多了，孩子是冲着钱背单词。<br>'
    +   '③ 用他真喜欢的小东西：雪糕、挑一集动画、晚睡 20 分钟、多玩半小时。<br>'
    +   '④ 大件放最后当长期目标，前面几档要容易够到。'
    + '</div>'
    + '<div class="rwe-head"><span class="h1">奖励名称（孩子看得懂的话）</span><span class="h2">需要碎片</span><span class="h3"></span></div>'
    + '<div class="rwe-list" id="rweList"></div>'
    + '<button class="rwe-add" id="rweAdd">＋ 再加一档奖励</button>'
    + '<div class="rwe-foot">现在这个档案有 <b>' + (S.shards||0) + '</b> 碎片。改完点下面保存，<b>已经兑换过的记录不会丢</b>。</div>'
    + '<div class="dlg-actions">'
    +   '<button class="btn btn-primary" id="rweSave">' + (first ? '保存并开始' : '保存') + '</button>'
    +   (first ? '<button class="btn btn-ghost" id="rweSkip">先用默认的</button>'
            : '<button class="btn btn-ghost" id="rweReset">恢复默认</button>')
    + '</div>'
    + (first ? '' : '<button class="btn btn-ghost" id="rweCancel" style="width:100%;margin-top:9px">取消</button>')
  , 'dlg-reward');

  function paint(){
    const box = d.q('#rweList');
    if(!box) return;
    box.innerHTML = list.map(function(r, i){
      return '<div class="rwe-row">'
        + '<input class="rwe-name" data-i="' + i + '" maxlength="12" value="' + esc(r.name) + '" placeholder="比如：一根雪糕">'
        + '<input class="rwe-cost" data-i="' + i + '" type="number" min="10" max="99999" inputmode="numeric" value="' + (r.cost||'') + '">'
        + '<button class="rwe-del" data-del="' + i + '" title="删掉这一档">×</button>'
        + '</div>';
    }).join('');
    const hd = d.root.querySelector('.rwe-head .h1');
    if(hd) hd.textContent = '奖励名称（共 ' + list.length + ' 档 · 用孩子听得懂的话）';
  }
  paint();

  d.root.addEventListener('input', function(e){
    const t = e.target;
    const i = parseInt(t.dataset.i, 10);
    if(isNaN(i) || !list[i]) return;
    if(t.classList.contains('rwe-name')) list[i].name = t.value;
    if(t.classList.contains('rwe-cost')) list[i].cost = parseInt(t.value, 10) || 0;
  });
  d.root.addEventListener('click', function(e){
    const del = e.target.closest('[data-del]');
    if(del){
      const i = parseInt(del.dataset.del, 10);
      if(list.length <= 1){ toast('至少留一档奖励', 'no'); return; }
      list.splice(i, 1); paint(); return;
    }
    if(e.target.closest('#rweAdd')){
      if(list.length >= 12){ toast('最多 12 档，够用了', 'no'); return; }
      let maxCost = 0;
      list.forEach(function(r){ if(r.cost > maxCost) maxCost = r.cost; });
      list.push({ id:'x' + Date.now().toString(36) + list.length, name:'', cost:(maxCost || 100) + 100, icon:REWARD_ICONS[list.length % REWARD_ICONS.length] });
      paint();
      const rows = d.root.querySelectorAll('.rwe-row');

      if(last){ const inp = last.querySelector('.rwe-name'); if(inp){ try{ inp.focus(); }catch(err){} } }
      return;
    }
  });

  function collect(){
    const out = [];
    for(let i=0;i<list.length;i++){
      const nm = String(list[i].name || '').trim();
      const cost = parseInt(list[i].cost, 10);
      if(!nm) return { err:'第 ' + (i+1) + ' 档还没填名称' };
      if(!(cost >= 10)) return { err:'「' + nm + '」的碎片数要填 10 以上' };
      if(cost > 99999) return { err:'「' + nm + '」的碎片数太大了' };
      out.push({ id:list[i].id, name:nm, cost:cost, icon:list[i].icon });
    }
    if(!out.length) return { err:'至少留一档奖励' };
    return { list: out };
  }

  d.q('#rweSave').onclick = function(){
    const r = collect();
    if(r.err){ toast(r.err, 'no'); return; }
    S.rewards = r.list;
    save();

  if(reset) reset.onclick = function(){

    S.rewards = null; save(); d.close();

  };

  const cancel = d.q('#rweCancel');
  if(cancel) cancel.onclick = d.close;
}

function advUnlocked(){ return stageCleared(myStage()) >= stageTotal(myStage()); }
function essayPoints(score){
  for(let i=0;i<ESSAY_POINTS.length;i++){ if(score >= ESSAY_POINTS[i].min) return ESSAY_POINTS[i].points; }
  return 0;
}
function essayRecord(id){
  S.advanced = S.advanced || { reads:{}, essays:{} };
  S.advanced.essays = S.advanced.essays || {};
  if(!S.advanced.essays[id]) S.advanced.essays[id] = { text:'', at:0, score:null, points:0 };
  return S.advanced.essays[id];
}
