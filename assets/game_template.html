function randomReading(){
  const reads = S.advanced.reads || {};
  const pool = ADV_READING.filter(r => !(reads[r.id] && reads[r.id].perfect));
  const list = pool.length ? pool : ADV_READING;
  const pick = list[Math.floor(Math.random() * list.length)];
  go('reading', pick.id);
}

function viewReading(id){
  const r = ADV_READING.filter(x => x.id === id)[0];
  if(!r){ go('advanced'); return; }
  /* 每次进入都打乱选项顺序，避免孩子记答案位置 */
  const qs = r.questions.map(function(q){
    const idx = q.opts.map(function(_, i){ return i; });
    for(let i = idx.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      const t = idx[i]; idx[i] = idx[j]; idx[j] = t;
    }
    return { q:q.q, opts: idx.map(function(i){ return q.opts[i]; }), a: idx.indexOf(q.a) };
  });
  const picks = qs.map(() => -1);

  main.innerHTML = `
    <div class="topbar" style="margin-bottom:14px">
      <div class="icon-btn" id="btnBack">${svg('back',17)}</div>
      <h2 style="font-size:17px;font-weight:800">阅读理解</h2>
      <div style="width:36px"></div>
    </div>
    <div class="rd-title">${esc(r.title)}</div>
    ${r.topic ? `<div style="font-size:12px;color:var(--sub);margin:-6px 0 12px">题材：${esc(r.topic)} · 5 题，全对 +${READ_POINTS} 积分</div>` : ''}
    <div class="rd-text">${r.text.map(p => '<p>' + esc(p) + '</p>').join('')}</div>
    <div class="sec-title"><span>题目</span><span style="font-size:11.5px;color:var(--sub)">5 题</span></div>
    <div class="rd-qs">
      ${qs.map((q, i) => `<div class="rd-q">
        <div class="rd-qtext">${i+1}. ${esc(q.q)}</div>
        <div class="rd-opts">${q.opts.map((o, j) => `<button class="rd-opt" data-q="${i}" data-o="${j}">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}</div>
      </div>`).join('')}
    </div>
    <div class="rd-actions"><button class="btn btn-primary" id="btnSubmit">提交答案</button></div>
  `;

  $('#btnBack').onclick = () => go('advanced');
  main.querySelectorAll('.rd-opt').forEach(b => {
    b.onclick = () => {
      const qi = +b.dataset.q;
      picks[qi] = +b.dataset.o;
      main.querySelectorAll('.rd-opt[data-q="' + qi + '"]').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
    };
  });
  let submitted = false;
  $('#btnSubmit').onclick = () => {
    if(submitted) return;
    if(picks.indexOf(-1) >= 0){ toast('还有题没选', 'no'); return; }
    submitted = true;
    let score = 0;
    qs.forEach((q, i) => { if(picks[i] === q.a) score++; });
    const perfect = score === qs.length;

    qs.forEach((q, i) => {
      const btns = main.querySelectorAll('.rd-opt[data-q="' + i + '"]');
      btns.forEach(b => {
        b.disabled = true;
        if(+b.dataset.o === q.a) b.classList.add('right');
        else if(+b.dataset.o === picks[i]) b.classList.add('wrong');
      });
    });

    S.advanced.reads = S.advanced.reads || {};
    const prev = S.advanced.reads[r.id] || {};
    const firstPerfect = perfect && !prev.perfect;
    S.advanced.reads[r.id] = {
      score: Math.max(score, prev.score || 0),
      perfect: !!(prev.perfect || perfect),
      at: Date.now()
    };
    if(firstPerfect){ addShards(READ_POINTS); }
    save();

    const btn = $('#btnSubmit');
    if(btn) btn.outerHTML = '<button class="btn btn-primary" id="btnDone">完成，回进阶挑战</button>';
    const done = $('#btnDone');
    if(done) done.onclick = () => go('advanced');
    toast(perfect ? ('全对，+' + READ_POINTS + ' 积分') : ('答对 ' + score + '/5，答案已标出'), perfect ? 'ok' : 'no');
    window.scrollTo(0, 0);
  };

    const r2 = essayRecord(id);
    r2.text = t; r2.at = Date.now();
    save();

function openGrade(id){
  const e = ADV_ESSAYS.filter(x => x.id === id)[0];
  const rec = essayRecord(id);

  const cur = (rec.score === null || rec.score === undefined) ? '' : rec.score;
  const d = dialog(

    + '<input id="gs" type="number" min="0" max="15" step="0.5" value="' + cur + '" placeholder="输入 0-15 分" style="width:100%;box-sizing:border-box;font:14px/1.5 inherit;border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#FCFAF5;margin-top:6px">'
    + '<div class="dlg-actions"><button class="btn btn-primary" id="gOk">确认打分</button>'
    + '<button class="btn btn-ghost" id="gCancel">取消</button></div>'
  );
  d.q('#gOk').onclick = () => {
    const v = parseFloat(d.q('#gs').value);
    if(isNaN(v) || v < 0 || v > 15){ toast('请输入 0-15 之间的分数', 'no'); return; }
    d.close();
    applyGrade(id, v);
  };
  d.q('#gCancel').onclick = d.close;
}

function applyGrade(id, score){
  const rec = essayRecord(id);
  const pts = essayPoints(score);
  const prevPts = rec.points || 0;
  const best = Math.max(rec.score || 0, score);
  if(pts > prevPts){
    addShards(pts - prevPts);
    toast('作文 ' + score + ' 分，得 ' + pts + ' 积分' + (prevPts ? '（补差额 ' + (pts - prevPts) + '）' : ''), 'ok');
  } else {
    toast('作文 ' + score + ' 分，没有超过已得积分', 'no');
  }
  rec.score = best;
  rec.points = Math.max(prevPts, pts);
  rec.gradedAt = Date.now();
  save();
  viewAdvanced();
}

/* ================= 存档导出 / 导入 ================= */
function canPersist(){ return !LS_MEM; }

function envWarn(){
  /* 桌面版（打包成 exe）自带持久化，不弹任何地址栏相关的提示 */
  if(window.__WQ_DESKTOP__) return '';
  if(LS_MEM){
    return '当前这个窗口不允许存本地数据，进度关掉就清空。请把文件下载到电脑，用 Edge 或 Chrome 双击打开。';
  }
  const ua = navigator.userAgent || '';
  if(/MicroMessenger|QQ\/|Weibo|DingTalk|AlipayClient/i.test(ua)){
    return '当前在微信/QQ 里打开，进度不会保存。请点右上角「…」选「用浏览器打开」，或下载到电脑后双击打开。';
  }
  if(location.protocol !== 'file:'){
    return '当前是预览窗口（地址栏是 http://127.0.0.1 开头），端口一换就等于换了地方，进度存不住。请把文件下载到电脑，双击打开再玩。';
  }
  return '';
}

function timeAgo(t){
  if(!t) return '';
  const m = Math.floor((Date.now() - t) / 60000);
  if(m < 1) return '刚刚';
  if(m < 60) return m + ' 分钟前';
  const h = Math.floor(m / 60);
  if(h < 24) return h + ' 小时前';
  const d = new Date(t);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}

function savedLabel(){
  if(!canPersist()) return '⚠ 进度存不下（当前窗口不支持）';
  const t = S.savedAt ? timeAgo(S.savedAt) : '';
  if(envWarn()) return '⚠ 只本次窗口有效' + (t ? ' · ' + t + '存过' : '');
  return t ? ('进度已存 · ' + t) : '进度存在本机浏览器';
}

let envGuarded = false;
/* ================= 防乱改：快捷键拦截 + 开发者工具提示 + 自愈 ================= */
/* 说明：浏览器里打开的网页，源码无法真正隐藏（这是浏览器机制，不是实现问题）。
   这里做的是「提高门槛」：拦住常见入口，孩子打开开发者工具时给出提示，
   并保证他就算删掉页面元素，刷新也能恢复原样。 */
let guardAlerted = false;

function installTamperGuard(){
  /* 1) 拦右键菜单 */
  document.addEventListener('contextmenu', function(e){
    if(e.target && e.target.tagName === 'INPUT') return;
    e.preventDefault();
  }, false);

  /* 2) 拦 F12 / Ctrl+Shift+I、J、C / Ctrl+U 查看源码 / Ctrl+S 保存 */
  document.addEventListener('keydown', function(e){
    const k = (e.key || '').toLowerCase();
    if(e.key === 'F12'){ e.preventDefault(); return; }
    if((e.ctrlKey || e.metaKey) && e.shiftKey && (k === 'i' || k === 'j' || k === 'c')){ e.preventDefault(); return; }
    if((e.ctrlKey || e.metaKey) && (k === 'u' || k === 's')){ e.preventDefault(); return; }
  }, true);

  /* 3) 检测开发者工具是否被拉开：以打开页面时的窗口差值为基准，突然多出一大块才提示
        （不用固定阈值——浏览器自带书签栏/工具栏本身就有 100~160px 差值，会误报） */
  let baseGap = Math.max(
    Math.abs((window.outerHeight || 0) - (window.innerHeight || 0)),
    Math.abs((window.outerWidth || 0) - (window.innerWidth || 0))
  );
  let devOpen = false;
  function checkDev(){
    const hGap = Math.abs((window.outerHeight || 0) - (window.innerHeight || 0));
    const wGap = Math.abs((window.outerWidth || 0) - (window.innerWidth || 0));
    const gap = Math.max(hGap, wGap);
    /* 差值比基准多出 200px 以上，才认为是开发者工具被拉开 */
    const open = gap > baseGap + 200;
    if(open && !devOpen){
      devOpen = true;
      showTamperNote();
    } else if(!open && devOpen){
      devOpen = false;
    }
    /* 窗口尺寸变化时同步抬升基准，避免拖窗口被误判 */
    if(gap < baseGap) baseGap = gap;
  }
  setInterval(checkDev, 1200);
}

function showTamperNote(){
  if(guardAlerted) return;
  guardAlerted = true;
  const d = dialog(
    '<h3>这里不能改哦</h3>'
    + '<p>这个窗口是给闯关用的，动了里面的东西，进度可能会乱。</p>'
    + '<p><b>放心：</b>文件本身不会坏，关掉窗口重新双击打开，一切照旧，碎片和关卡都在。</p>'
    + '<p>想看看自己学得怎么样，去「我的收藏」和「奖励兑换」就行。</p>'
    + '<div class="dlg-actions"><button class="btn btn-primary" id="tpOk">继续闯关</button></div>'
  );
  d.q('#tpOk').onclick = d.close;
}

/* 4) 自愈：页面被删坏时，关键节点缺失就自动重载一次 */
function installSelfHeal(){
  let healed = false;
  setInterval(function(){
    if(healed) return;
    const needMain = document.getElementById('main');
    const needHud = document.getElementById('hud');
    if(!needMain || !needHud){
      healed = true;
      try{ sessionStorage.setItem('wbg_healed', '1'); }catch(e){}
      location.reload();
    }
  }, 2000);
}

function guardEnv(){
  if(envGuarded) return;
  const w = envWarn();
  if(!w) return;
  envGuarded = true;
  const d = dialog(
    '<h3>⚠ 这个窗口存不住进度</h3>'
    + '<p>' + esc(w) + '</p>'
    + '<p><b>怎么判断开对了没有：看地址栏。</b><br>'
    + '以 <b>file:///</b> 开头 = 对了，进度会一直留着；<br>'
    + '以 <b>http://127.0.0.1</b> 开头 = 预览窗口，关掉就清空。</p>'
    + '<p><b>正确做法：</b>把文件保存到电脑（比如 D 盘建个「单词闯关」文件夹），以后每次都双击这个文件打开。</p>'
    + '<p>之前做的进度如果旧窗口还开着，先点「导出存档」，再到新窗口点「导入存档」。</p>'
    + '<div class="dlg-actions"><button class="btn btn-primary" id="envOk">我知道了</button></div>'
  );
  d.q('#envOk').onclick = d.close;
}

function dialog(html, cls){
  const mask = document.createElement('div');
  mask.className = 'mask';
  mask.innerHTML = '<div class="dlg' + (cls ? ' ' + cls : '') + '">' + html + '</div>';
  document.body.appendChild(mask);
  const close = function(){ if(mask.parentNode) mask.remove(); };
  mask.addEventListener('click', function(e){ if(e.target === mask) close(); });
  return { root: mask, q: function(sel){ return mask.querySelector(sel); }, close: close };
}

function copyText(t){
  const done = function(){ toast('已复制，存到微信收藏或记事本里'); };
  const fallback = function(){
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try{ ok = document.execCommand('copy'); }catch(e){}
    ta.remove();
    if(ok) done(); else toast('复制失败，请手动全选文字复制', 'no');
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done, fallback);
  } else fallback();
}

function exportArchive(){
  const n = Object.keys(S.clearedWords || {}).length;
  const data = { app:'wbg-wordgame', v:1, at:new Date().toISOString(), words:n, save:S };
  const txt = JSON.stringify(data);
  let downloaded = false;
  try{
    const blob = new Blob([txt], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '单词闯关存档_' + today() + '_' + n + '词.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
    downloaded = true;
  }catch(e){}
  const d = dialog(
    '<h3>存档已导出</h3>'
    + '<p>' + (downloaded ? '文件已存到浏览器的「下载」文件夹。' : '浏览器没让自动下载，请用下面的存档码。')
    + '<b>以后更新文件、换电脑、换浏览器，用新文件的「导入存档」把它读回来，进度就回来了。</b></p>'
    + '<p>也可以把存档码复制到微信收藏留一份，防止文件丢了。</p>'
    + '<textarea readonly id="arTxt"></textarea>'
    + '<div class="dlg-actions"><button class="btn btn-primary" id="arCopy">复制存档码</button>'
    + '<button class="btn btn-ghost" id="arClose">关闭</button></div>'
  );
  d.q('#arTxt').value = txt;
  d.q('#arCopy').onclick = function(){ copyText(txt); };
  d.q('#arClose').onclick = d.close;
}

function importArchive(){
  const d = dialog(
    '<h3>导入存档</h3>'
    + '<p>选之前导出的 <b>.json</b> 文件，或者把存档码粘到下面的框里。<b>导入会覆盖当前进度。</b></p>'
    + '<label class="dlg-file">选存档文件<input type="file" id="imFile" accept=".json,.txt,application/json,text/plain" style="display:none"></label>'
    + '<textarea id="imTxt" placeholder="把存档码粘到这里"></textarea>'
    + '<div class="dlg-actions"><button class="btn btn-primary" id="imGo">导入并恢复</button>'
    + '<button class="btn btn-ghost" id="imCancel">取消</button></div>'
  );
  d.q('#imFile').onchange = function(e){
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = function(){ d.q('#imTxt').value = String(r.result || ''); toast('文件已读入，点「导入并恢复」'); };
    r.onerror = function(){ toast('这个文件读不出来', 'no'); };
    r.readAsText(f, 'utf-8');
  };
  d.q('#imGo').onclick = function(){ applyArchive(d.q('#imTxt').value, d); };
  d.q('#imCancel').onclick = d.close;
}

function applyArchive(txt, dlg){
  txt = String(txt || '').trim();
  if(!txt){ toast('先选文件或粘贴存档码', 'no'); return; }
  let o = null;
  try{ o = JSON.parse(txt); }catch(e){ toast('这段内容不是存档，确认复制完整了吗', 'no'); return; }
  const sv = o && o.save ? o.save : (o && (o.levels || o.clearedWords) ? o : null);
  if(!sv || typeof sv !== 'object'){ toast('这不是本游戏的存档', 'no'); return; }
  const incWords = Object.keys(sv.clearedWords || {}).length;
  const curWords = Object.keys(S.clearedWords || {}).length;
  const ok = confirm('导入的存档：' + incWords + ' 个词、' + (sv.shards || 0) + ' 碎片\n当前进度：' + curWords + ' 个词、' + (S.shards || 0) + ' 碎片\n\n导入会覆盖当前进度，确定吗？');
  if(!ok) return;
  S = pickSave(sv);
  save();
  if(dlg) dlg.close();
  toast('存档已恢复，正在刷新…', 'ok');
  setTimeout(function(){ location.reload(); }, 700);
}

/* ================= 提示条 ================= */
function toast(msg, kind){
  const d = document.createElement('div');
  d.className = 'feedback' + (kind ? ' ' + kind : '');
  d.innerHTML = `<span>${esc(msg)}</span>`;
  document.body.appendChild(d);
  setTimeout(()=>{ if(d.parentNode) d.remove(); }, 1600);
}

/* ================= 启动 ================= */
function bootRender(){
  initProfiles();
  TTS.init();
  if(curProfile()){
    loadSave();
    currentBook = gradeBook(curProfile().grade);
    if(S.todayCount === undefined) S.todayCount = 0;
    if(S.lastDay !== today()) S.todayCount = 0;
    // 连续打卡断签检查
    if(S.lastDay && dayDiff(S.lastDay, today()) > 1) { S.streak = 0; }
    go('map');
  } else {
    showProfileGate(true);
  }
  guardEnv();
  installTamperGuard();
  installSelfHeal();
  window.addEventListener('beforeunload', function(e){
    fileFlush();
    if(!canPersist()){
      e.preventDefault();
      e.returnValue = '当前窗口不保存进度，确定要关掉吗？';
      return e.returnValue;
    }
  });
  window.addEventListener('pagehide', fileFlush);
}

/* 读存档文件后再渲染，避免"先空着再突然冒出档案" */
function refreshAfterLoad(){
  if(curProfile()){
    loadSave();
    currentBook = gradeBook(curProfile().grade);
    if(document.querySelector('.pg-card')) showProfileGate(false);
    else if(document.querySelector('.stage-now')) viewMap();
  } else {
    showProfileGate(true);
  }
}

(function startApp(){
  let started = false;
  function once(){ if(started) return; started = true; bootRender(); }

  if(location.hostname === '127.0.0.1'){
    /* 桌面版：桥接就绪 → 先读存档文件 → 再渲染 */
    window.addEventListener('pywebviewready', function(){
      fileLoad(function(changed){
        if(!started) once();
        else if(changed) refreshAfterLoad();
      });
    });
    setTimeout(once, 700);   // 桥接异常也不能白屏
  } else {
    once();                  // 纯 HTML 版：只用 localStorage
  }
})();
</script>
